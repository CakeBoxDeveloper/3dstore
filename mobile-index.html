<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRISM</title>
  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif; color: #ffffff;
      background-color: #17212b;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
    }

    @font-face {
      font-family: 'Ageta';
      src: url('https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/main/liquid.italic.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* ── Flat Telegram Dark Theme (all corners 4px) ── */
    .glass {
      background: #1d2b3a;
      border: 1px solid rgba(106, 178, 242, 0.2);
      border-radius: 4px;
    }

    .header-logo,
    .footer-input-face,
    .footer-face {
      background: #1d2b3a;
      border: 1px solid rgba(106, 178, 242, 0.2);
      border-radius: 4px;
      box-shadow: none;
    }

    /* ── Хедер: две колонки 30/70 ── */
    .card-header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 3fr 7fr;
      gap: 8px;
      height: 44px;
      background: transparent;
      position: relative;
      z-index: 1;
    }
    .card-header::after { display: none; }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .logo {
      font-family: 'Ageta', system-ui, sans-serif;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: #ffffff;
      user-select: none;
    }

    /* Хедер-тикер */
    .header-ticker {
      position: relative;
      border-radius: 4px;
    }

    .ticker-bg { display: none; }
    .ticker-sheen { display: none; }

    .header-ticker .footer-input-scene {
      perspective: 300px;
      position: relative;
      z-index: 1;
    }
    .ticker-input-rotor {
      width: 100%; height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ticker-face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em;
      color: #6ab2f2;
      opacity: 0;
      transition: opacity 0.35s ease;
      cursor: pointer;
      text-decoration: none;
      background: #1d2b3a;
      border: 1px solid rgba(106, 178, 242, 0.2);
      border-radius: 4px;
    }
    .ticker-face.active { opacity: 1; }
    .ticker-face:hover { color: #ffffff; }

    .ticker-arrow-big {
      font-size: 18px;
      line-height: 1;
      color: rgba(106, 178, 242, 0.6);
      flex-shrink: 0;
      pointer-events: none;
      user-select: none;
    }

    .ticker-arrow {
      font-size: 10px;
      color: rgba(106, 178, 242, 0.4);
      pointer-events: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .ticker-arrow-up { margin-right: 8px; }
    .ticker-arrow-dn { margin-left: 8px; }
    .ticker-text { flex: 1; text-align: center; }

    .tg-link {
      font-size: 13px;
      color: #6ab2f2;
      text-decoration: none;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .tg-link:hover { color: #ffffff; }

    /* ── Футер: сообщение ── */
    .card-footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 7fr 3fr;
      gap: 8px;
      height: 44px;
      background: transparent;
      overflow: visible;
      position: relative;
      z-index: 2;
    }
    .footer-prism-wrap {
      overflow: visible;
      position: relative;
      height: 44px;
      background: transparent;
    }
    .footer-input-scene {
      width: 100%;
      height: 44px;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }
    .footer-input-rotor {
      width: 100%;
      height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-input-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 0 12px;
      background: #1d2b3a;
      border: 1px solid rgba(106, 178, 242, 0.2);
      font-family: inherit;
      overflow: hidden;
    }

    .fin-shimmer { display: none; }
    .fin-f0 { transform: rotateX(0deg)    translateZ(15px); }
    .fin-f1 { transform: rotateX(-120deg) translateZ(15px); justify-content: center; }
    .fin-f2 { transform: rotateX(-240deg) translateZ(15px); cursor: pointer; }

    .footer-input-face input {
      width: 100%; background: transparent; border: none; outline: none;
      color: #ffffff; font-size: 13px; font-family: inherit;
    }
    .footer-input-face input::placeholder { color: rgba(255, 255, 255, 0.45); }

    .fin-f1-text { font-size: 12px; color: rgba(255, 255, 255, 0.6); }
    .fin-f2-text { font-size: 12px; color: #6ab2f2; line-height: 1.4; }

    .footer-btn-wrap {
      overflow: visible;
      position: relative;
      height: 44px;
    }
    .footer-scene {
      width: 100%;
      height: 44px;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }
    .footer-rotor {
      width: 100%;
      height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #6ab2f2;
      color: #17212b;
      cursor: pointer;
      border: none;
      font-family: inherit;
      outline: none;
      overflow: hidden;
    }
    .footer-f0 { transform: rotateX(0deg) translateZ(15px); }
    .footer-f0:hover { opacity: 0.9; }
    .footer-f0:disabled { background: #1d2b3a !important; color: rgba(255,255,255,0.3) !important; border: 1px solid rgba(106, 178, 242, 0.2) !important; }
    .footer-f1 { transform: rotateX(-120deg) translateZ(15px); background: #1d2b3a; color: #6ab2f2; font-size: 11px; border: 1px solid rgba(106, 178, 242, 0.2); }
    .footer-f1-shimmer { display: none; }

    .card-catalog {
      overflow: visible;
      flex: 1;
      min-height: 0;
      background: transparent;
      border-radius: 4px;
      position: relative;
      z-index: 3;
    }

    /* ══ ПРИЗМА (ось Y) ══ */
    .h-scene {
      width: 100%;
      height: 100%;
      perspective: 900px;
      perspective-origin: 50% 50%;
    }

    .h-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-133px) rotateY(0deg);
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .h-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #1d2b3a;
      border: 1px solid rgba(106, 178, 242, 0.2);
      border-radius: 4px;
      box-shadow: none;
    }

    .h-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 10%,
        rgba(106, 178, 242, 0.05) 35%,
        rgba(255, 255, 255, 0.22) 50%,
        rgba(106, 178, 242, 0.05) 65%,
        transparent 90%
      );
      transform: translateX(-150%);
      pointer-events: none;
      z-index: 10;
    }
    .h-rotor.spinning .h-face::after {
      animation: face-shimmer 0.7s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes face-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(120%); }
    }

    .border-glow-wrap { display: none; }
    .border-glow { display: none; }
    .border-glow-sm { display: none; }

    .arrow-icon {
      width: 16px; height: 16px;
      opacity: 0.6;
      flex-shrink: 0;
      pointer-events: none;
    }
    .arrow-icon-down { transform: rotate(180deg); }

    .h-f0 { transform: rotateY(0deg)   translateZ(133px); }
    .h-f1 { transform: rotateY(120deg) translateZ(133px); }
    .h-f2 { transform: rotateY(240deg) translateZ(133px); }

    .face-header {
      padding: 12px 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
    }

    .face-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
      text-align: center;
      flex: 1;
    }

    .face-nav-btn {
      background: none;
      border: none;
      color: rgba(106, 178, 242, 0.8);
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      transition: opacity 0.15s;
      flex-shrink: 0;
      opacity: 0.8;
      display: flex;
      align-items: center;
    }
    .face-nav-btn:hover { opacity: 1; }
    .face-nav-btn img { width: 13px; height: 13px; filter: invert(1); }
    .face-nav-btn-prev img { transform: rotate(-90deg); }
    .face-nav-btn-next img { transform: rotate(90deg); }

    .face-scroll-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      margin-bottom: 40px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 28px, black calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, black 28px, black calc(100% - 28px), transparent 100%);
    }
    .face-scroll-wrap.at-top {
      -webkit-mask-image: linear-gradient(to bottom, black 0px, black calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to bottom, black 0px, black calc(100% - 28px), transparent 100%);
    }
    .face-scroll-wrap.at-bottom {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 28px, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, black 28px, black 100%);
    }
    .face-scroll-wrap.at-top.at-bottom {
      -webkit-mask-image: none;
      mask-image: none;
    }

    .face-body {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 8px 8.5% 80px;
    }
    .face-body::-webkit-scrollbar { display: none; }

    .sub-block { margin-bottom: 16px; }
    .sub-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: rgba(255,255,255,0.7);
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      justify-items: center;
    }

    .prod-icon {
      width: 25%;
      aspect-ratio: 1;
      background: #17212b;
      border: 1px solid rgba(106, 178, 242, 0.2);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      transition: border-color 0.15s;
    }
    .sub-products .prod-icon {
      width: 100%;
      position: relative;
    }
    .prod-icon-name {
      position: absolute;
      top: 3px;
      left: 4px;
      right: 4px;
      height: 16px;
      padding: 1px 2px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-mask-image: linear-gradient(90deg, transparent 0px, black 6px, black calc(100% - 6px), transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0px, black 6px, black calc(100% - 6px), transparent 100%);
    }
    .prod-icon-name .marquee-text {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    .prod-icon-name .marquee-active {
      animation: marquee-pingpong var(--marquee-duration, 5s) ease-in-out infinite;
    }
    @keyframes marquee-pingpong {
      0%, 18% { transform: translateX(0); }
      50%, 68% { transform: translateX(var(--marquee-dist, -24px)); }
      100% { transform: translateX(0); }
    }
    .prod-icon canvas {
      flex: 1;
      min-height: 0;
      width: 100% !important;
      display: block;
    }
    .prod-icon:hover, .prod-icon:active {
      border-color: #6ab2f2;
    }
    .prod-icon img { width: 100%; flex: 1; min-height: 0; object-fit: contain; padding: 4px; display: block; }
    .pi-ph { font-size: 18px; opacity: 0.3; }

    /* ── Стили пульсирующего лоадера PRISM ── */
    .prism-loader-box {
      position: relative;
      width: 220px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prism-loader-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
      animation: prism-pulse-glow 2.4s ease-in-out infinite alternate;
    }
    @keyframes prism-pulse-glow {
      0% {
        opacity: 0.55;
        filter: brightness(0) invert(1) drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        transform: scale(0.97);
      }
      50% {
        opacity: 1;
        filter: brightness(0) invert(1)
                drop-shadow(0 0 14px rgba(255, 255, 255, 0.95))
                drop-shadow(0 0 28px rgba(100, 140, 255, 0.6))
                drop-shadow(0 0 45px rgba(255, 80, 140, 0.35));
        transform: scale(1.02);
      }
      100% {
        opacity: 0.55;
        filter: brightness(0) invert(1) drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        transform: scale(0.97);
      }
    }

    .empty-cat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 200px;
      gap: 12px;
      margin: 12px;
      border-radius: 4px;
      position: relative;
      background: #17212b;
      border: 1px solid rgba(106, 178, 242, 0.2);
      padding: 24px 20px;
    }
    .empty-cat-logo {
      height: 28px;
      filter: brightness(0) invert(1);
      opacity: 0.5;
      display: block;
    }
    .empty-cat-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .empty-cat-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      max-width: 200px;
      line-height: 1.5;
    }

    .prod-palette {
      display: flex;
      gap: 2px;
      padding: 3px 4px 0;
      justify-content: center;
      flex-wrap: wrap;
    }
    .prod-palette-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      opacity: 0.75;
      flex-shrink: 0;
    }

  </style>

  
</head>
<body>
  <!-- ── Лоадер страницы ── -->
  <div id="page-loader" style="
    position:fixed;inset:0;z-index:9999;
    background:#17212b;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity 0.5s ease;
  ">
    <div class="prism-loader-box">
      <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg"
           class="prism-loader-logo" alt="PRISM">
    </div>
  </div>
  <script>
    (function() {
      const loader = document.getElementById('page-loader');
      const MIN_MS = 1400;
      const start  = Date.now();

      window.addEventListener('load', () => {
        const delay = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(() => {
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 520);
          }
        }, delay);
      });
    })();
  </script>
  <!-- Анимированные точки в узлах сетки -->
  

  <div class="page">

    <div class="card-header">
      <div class="header-logo">
        <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg" alt="PRISM" style="height:22px;filter:brightness(0) invert(1);display:block;">
      </div>
      <div class="header-ticker">
        <!-- фоновый слой: клипает шиммер, не мешает 3D -->
        <div class="ticker-bg">
          <div class="ticker-sheen"></div>
        </div>
        <!-- 3D сцена поверх, без overflow:hidden -->
        <div class="footer-input-scene" style="position:relative">
          <div class="ticker-input-rotor" id="ticker-rotor">
            <div class="footer-input-face fin-f0" data-href="https://t.me/prism3dstore" style="display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;">
              <div class="border-glow-wrap"><div class="border-glow-sm"></div></div>
              <span class="ticker-arrow-big">↑</span>
              <a href="https://t.me/prism3dstore" target="_blank" style="font-size:13px;font-weight:800;color:#ffffff;position:relative;z-index:2;text-decoration:none;flex:1;text-align:center;">Написати нам у Telegram</a>
              <span class="ticker-arrow-big">↓</span>
            </div>
            <div class="footer-input-face fin-f1" data-href="https://instagram.com/prism3dstore" style="display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;">
              <div class="border-glow-wrap"><div class="border-glow-sm" style="animation-delay:-13s"></div></div>
              <span class="ticker-arrow-big">↑</span>
              <a href="https://instagram.com/prism3dstore" target="_blank" style="font-size:13px;font-weight:800;color:#ffffff;position:relative;z-index:2;text-decoration:none;flex:1;text-align:center;">Написати нам в Instagram</a>
              <span class="ticker-arrow-big">↓</span>
            </div>
            <div class="footer-input-face fin-f2" data-href="https://viber.com" style="display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;">
              <div class="border-glow-wrap"><div class="border-glow-sm" style="animation-delay:-26s"></div></div>
              <span class="ticker-arrow-big">↑</span>
              <a href="https://viber.com" target="_blank" style="font-size:13px;font-weight:800;color:#ffffff;position:relative;z-index:2;text-decoration:none;flex:1;text-align:center;">Написати нам у Viber</a>
              <span class="ticker-arrow-big">↓</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-catalog">
      <div class="h-scene">
        <div class="h-rotor" id="h-rotor"></div>
      </div>
    </div>

    <!-- Футер: призма поля ввода + кнопка отправки -->
    <div class="card-footer">
      <!-- Поле ввода — призма 3 грани -->
      <div class="footer-prism-wrap">
        <div class="footer-input-scene">
          <div class="footer-input-rotor" id="fin-rotor">
            <!-- Грань 0: поле ввода -->
            <div class="footer-input-face fin-f0">
              <div class="fin-shimmer"></div>
              <input type="text" id="footer-input" placeholder="Напишіть нам, оператор на зв'язку" autocomplete="off">
            </div>
            <!-- Грань 1: ожидание ответа -->
            <div class="footer-input-face fin-f1">
              <div class="fin-shimmer"></div>
              <div class="fin-wait-shimmer"></div>
              <span class="fin-f1-text">Очікування відповіді оператора…</span>
            </div>
            <!-- Грань 2: ответ оператора -->
            <div class="footer-input-face fin-f2" id="fin-reply">
              <div class="fin-shimmer"></div>
              <span class="fin-f2-text" id="fin-reply-text"></span>
            </div>
          </div>
        </div>
      </div>
      <!-- Кнопка отправки — призма -->
      <div class="footer-btn-wrap">
        <div class="footer-scene">
          <div class="footer-rotor" id="footer-rotor">
            <button class="footer-face footer-f0" id="footer-send">Відправити</button>
            <div class="footer-face footer-f1"><div class="footer-f1-shimmer"></div>✓</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="catalog.js"></script>

  
  
  <script>
    const R = 133;
    let angle = 0;

    // Helper: список путей к картинкам превью (в папке модели с тем же названием)
    function getModelPreviewUrls(p, cat) {
      const urls = [];
      if (p.model) {
        const lastSlash = p.model.lastIndexOf('/');
        const dir = lastSlash !== -1 ? p.model.substring(0, lastSlash) : '';
        const file = lastSlash !== -1 ? p.model.substring(lastSlash + 1) : p.model;
        const base = file.replace(/\.[^/.]+$/, ''); // название модели (напр. model)
        
        if (dir) {
          // Превью в папке модели с таким же названием
          urls.push(`${dir}/${base}.webp`);
          urls.push(`${dir}/${base}.png`);
          urls.push(`${dir}/${base}.jpg`);
          urls.push(`${dir}/${base}.jpeg`);
          urls.push(`${dir}/preview.webp`);
          urls.push(`${dir}/preview.png`);
          urls.push(`${dir}/preview.jpg`);
          urls.push(`${dir}/${p.id}.webp`);
          urls.push(`${dir}/${p.id}.png`);
          urls.push(`${dir}/${p.id}.jpg`);
        }
      }

      if (p.thumbnail) {
        urls.push(p.thumbnail.replace(/^\//, ''));
      }
      
      if (cat && cat.id) {
        const catFolder = cat.id.charAt(0).toUpperCase() + cat.id.slice(1);
        urls.push(`Catalog/${catFolder}/${p.id}/model.webp`);
        urls.push(`Catalog/${catFolder}/${p.id}/model.png`);
        urls.push(`Catalog/${catFolder}/${p.id}/preview.webp`);
        urls.push(`Catalog/${catFolder}/${p.id}/preview.png`);
      }

      urls.push(`thumbnails/${p.id}.webp`);
      urls.push(`thumbnails/${p.id}.png`);

      return [...new Set(urls)];
    }

    async function init() {
      const data = await loadCatalog();
      const cats = data.categories;
      const rotor = document.getElementById('h-rotor');

      cats.forEach((cat, i) => {
        const face = document.createElement('div');
        face.className = `h-face h-f${i}`;
        face.style.transform = `rotateY(${i * 120}deg) translateZ(${R}px)`;

        // Заголовок
        const header = document.createElement('div');
        header.className = 'face-header';
        header.innerHTML = `
          <button class="face-nav-btn face-nav-btn-prev" data-dir="-1"><img src="https://www.svgrepo.com/show/466811/up-sign.svg" alt="prev"></button>
          <span class="face-title">${cat.name}</span>
          <button class="face-nav-btn face-nav-btn-next" data-dir="1"><img src="https://www.svgrepo.com/show/466811/up-sign.svg" alt="next"></button>
        `;
        header.querySelectorAll('.face-nav-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            spin(parseInt(btn.dataset.dir));
          });
        });
        face.appendChild(header);

        // Скролл-обёртка
        const scrollWrap = document.createElement('div');
        scrollWrap.className = 'face-scroll-wrap at-top';

        const body = document.createElement('div');
        body.className = 'face-body';

        const groups = [];
        if (cat.products && cat.products.length > 0) {
          groups.push({ name: '', products: cat.products });
        }
        if (cat.subcategories && cat.subcategories.length > 0) {
          cat.subcategories.forEach(sub => {
            if (sub.products && sub.products.length > 0) {
              groups.push(sub);
            }
          });
        }

        if (groups.length === 0) {
          const stub = (cat.id === 'wax') 
            ? { sub: 'Авторські соєві свічки з силіконовими формами — нові аромати та дизайни з\'являться тут першими.' }
            : { sub: 'Скоро тут з\'являться нові товари.' };
          const emptyBlock = document.createElement('div');
          emptyBlock.className = 'empty-cat';
          emptyBlock.innerHTML = `
            <img class="empty-cat-logo"
                 src="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg"
                 alt="PRISM">
            <span class="empty-cat-title">Скоро у продажу</span>
            <span class="empty-cat-sub">${stub.sub} А поки що — загляньте в інші категорії.</span>
          `;
          body.appendChild(emptyBlock);
        } else {
          groups.forEach(sub => {
            const block = document.createElement('div');
            block.className = 'sub-block';
            if (sub.name) {
              block.innerHTML = `<div class="sub-title">${sub.name}</div>`;
            }

            const grid = document.createElement('div');
            grid.className = 'sub-products';

            sub.products.forEach(p => {
              const icon = document.createElement('div');
              icon.className = 'prod-icon';
              icon.title = `${p.name} (id: ${p.id})`;
              icon.onclick = () => location.href = `mobile-product.html?id=${p.id}`;

              // Название модели сверху превью (бегущая строка)
              const titleOverlay = document.createElement('div');
              titleOverlay.className = 'prod-icon-name';
              const titleSpan = document.createElement('span');
              titleSpan.className = 'marquee-text';
              titleSpan.textContent = p.name;
              titleOverlay.appendChild(titleSpan);
              icon.appendChild(titleOverlay);

              setTimeout(() => {
                const overflow = titleSpan.scrollWidth - titleOverlay.clientWidth;
                if (overflow > 2) {
                  const dist = overflow + 8;
                  const duration = Math.max(3.5, dist / 14);
                  titleSpan.style.setProperty('--marquee-dist', `-${dist}px`);
                  titleSpan.style.setProperty('--marquee-duration', `${duration}s`);
                  titleSpan.classList.add('marquee-active');
                }
              }, 120);

              // Превью из папки с моделью (с таким же названием)
              const img = document.createElement('img');
              img.alt = p.name;
              img.loading = 'lazy';
              img.style.cssText = 'width:100%;flex:1;min-height:0;object-fit:contain;padding:4px;display:block;';

              const candidates = getModelPreviewUrls(p, cat);
              let attempt = 0;
              function loadNext() {
                if (attempt < candidates.length) {
                  img.src = candidates[attempt++];
                } else {
                  img.style.display = 'none';
                  const ph = document.createElement('span');
                  ph.className = 'pi-ph';
                  ph.textContent = '⬡';
                  icon.appendChild(ph);
                }
              }
              img.onerror = loadNext;
              loadNext();
              icon.appendChild(img);

              grid.appendChild(icon);
            });

            block.appendChild(grid);
            body.appendChild(block);
          });
        }

        scrollWrap.appendChild(body);
        face.appendChild(scrollWrap);
        rotor.appendChild(face);

        function updateFade() {
          const { scrollTop, scrollHeight, clientHeight } = body;
          scrollWrap.classList.toggle('at-top', scrollTop < 8);
          scrollWrap.classList.toggle('at-bottom', scrollTop + clientHeight >= scrollHeight - 8);
        }
        body.addEventListener('scroll', updateFade, { passive: true });
        requestAnimationFrame(updateFade);
      });

      function spin(dir) {
        angle -= dir * 120;
        rotor.style.transform = `translateZ(-${R}px) rotateY(${angle}deg)`;
        rotor.classList.add('spinning');
        setTimeout(() => rotor.classList.remove('spinning'), 700);
      }

      let tx = 0;
      document.querySelector('.card-catalog').addEventListener('touchstart', e => {
        tx = e.touches[0].clientX;
      }, { passive: true });
      document.querySelector('.card-catalog').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 40) spin(dx < 0 ? 1 : -1);
      });

      rotor.style.transform = `translateZ(-${R}px) rotateY(0deg)`;
    }

    init();


    // Добавляем анимированный контур на хедер-лого (тонкий вариант)
    (function() {
      // Хедер-лого
      const logo = document.querySelector('.header-logo');
      if (logo) {
        const wrap = document.createElement('div');
        wrap.className = 'border-glow-wrap';
        const g = document.createElement('div');
        g.className = 'border-glow-sm';
        g.style.animationDelay = '-7s';
        wrap.appendChild(g); logo.appendChild(wrap);
      }
      // Грани кнопки "Відправити"
      document.querySelectorAll('.footer-face').forEach((face, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'border-glow-wrap';
        const g = document.createElement('div');
        g.className = 'border-glow-sm';
        g.style.animationDelay = `${-14 - i*5}s`;
        wrap.appendChild(g); face.appendChild(wrap);
      });
      // Грани поля ввода (только настоящие, не тикер)
      document.querySelectorAll('#fin-rotor .footer-input-face').forEach((face, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'border-glow-wrap';
        const g = document.createElement('div');
        g.className = 'border-glow-sm';
        g.style.animationDelay = `${-20 - i*4}s`;
        wrap.appendChild(g); face.appendChild(wrap);
      });
    })();

    // Тикер — призма rotateX, клик = флип, долгое нажатие = открыть ссылку
    (function() {
      const tickerWrap = document.querySelector('.header-ticker');
      const tickerRotor = document.getElementById('ticker-rotor');
      if (!tickerWrap || !tickerRotor) return;

      let tickerAngle = 0;
      let pressStart = 0;
      let faceIndex = 0;
      const faces = tickerRotor.querySelectorAll('[data-href]');

      tickerWrap.addEventListener('pointerdown', () => { pressStart = Date.now(); });
      tickerWrap.addEventListener('pointerup', () => {
        const held = Date.now() - pressStart;
        if (held > 400 && faces[faceIndex]) {
          window.open(faces[faceIndex].dataset.href, '_blank');
        } else {
          tickerAngle -= 120;
          faceIndex = (faceIndex + 1) % faces.length;
          tickerRotor.style.transform = `translateZ(-15px) rotateX(${tickerAngle}deg)`;
        }
      });
    })();

    // ── Логика футера (чат с оператором) ──────────────────────────────────
    (function() {
      const finRotor  = document.getElementById('fin-rotor');
      const input     = document.getElementById('footer-input');
      const sendBtn   = document.getElementById('footer-send');
      const replyText = document.getElementById('fin-reply-text');

      let finAngle = 0;
      let chatFace = 0;
      let pollTimer = null;

      // session_id — уникальный для каждой сессии браузера
      let session = sessionStorage.getItem('chat_session');
      if (!session) {
        session = Math.random().toString(36).slice(2) + Date.now().toString(36);
        sessionStorage.setItem('chat_session', session);
      }

      function spinField(face) {
        chatFace = face;
        finAngle = Math.round(finAngle / 360) * 360 + face * 120;
        finRotor.style.transform = `translateZ(-15px) rotateX(${finAngle}deg)`;
        // Shimmer — reflow сбрасывает анимацию перед повторным запуском
        finRotor.classList.remove('spinning');
        void finRotor.offsetWidth;
        finRotor.classList.add('spinning');
        setTimeout(() => finRotor.classList.remove('spinning'), 520);
      }

      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(async () => {
          try {
            const r    = await fetch(`/api/chat-poll?s=${session}`);
            const data = await r.json();
            if (data.reply) {
              stopPolling();
              replyText.textContent = data.reply;
              spinField(2);
              sendBtn.textContent  = 'Відповісти';
              sendBtn.disabled     = false;
              sendBtn.style.opacity = '1';
            }
          } catch(e) {}
        }, 2000);
      }

      function stopPolling() {
        clearInterval(pollTimer);
        pollTimer = null;
      }

      sendBtn.addEventListener('click', async () => {
        if (chatFace === 2) {
          // Новая сессия + переход на грань 0 следующего цикла (вперёд, не назад)
          session = Math.random().toString(36).slice(2) + Date.now().toString(36);
          sessionStorage.setItem('chat_session', session);
          // Текущий угол = base + 240. Грань 0 следующего цикла = base + 360.
          // Значит крутим на +120 вперёд
          finAngle += 120;
          finRotor.style.transform = `translateZ(-15px) rotateX(${finAngle}deg)`;
          chatFace = 0;
          sendBtn.textContent = 'Відправити';
          setTimeout(() => input.focus(), 520);
          return;
        }

        const msg = input.value.trim();
        if (!msg) return;

        spinField(1);
        sendBtn.disabled = true;
        input.value = '';

        try {
          await fetch('/api/chat-send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, session }),
          });
        } catch(e) { console.error(e); }

        startPolling();
      });

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendBtn.click();
      });
    })();
  </script>
  <!-- SVG фильтр: квадратная линза — центр ровный, края искажены -->
  <!-- SVG фильтр для преломления + motion blur при вращении -->
  

  <script>
  // ── Рёбра задних граней призмы ──
  (function() {
    const canvas = document.getElementById('prism-edges');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const R = 133; // радиус вписанной окружности (translateZ)
    const perspective = 900;

    // Синхронизируемся с текущим углом h-rotor через CSS transform
    let currentAngle = 0; // в градусах, совпадает с angle в init()

    function project(x, y, z) {
      // Точно как CSS perspective: 900px, perspective-origin: 50% 50%
      // h-rotor: translateZ(-133px), грань: translateZ(+133px) → суммарно z=0 для передней
      // Добавляем translateZ(-133px) ротора к z грани
      const d = 900; // perspective
      const zTotal = z - R; // translateZ(-R) от ротора + translateZ(z) грани
      const scale = d / (d - zTotal);
      return {
        x: canvas.width  / 2 + x * scale,
        y: canvas.height / 2 + y * scale,
      };
    }

    function drawEdges(angleDeg) {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const H = canvas.height;
      const yTop    = -H / 2;
      const yBottom =  H / 2;

      // 3 вершины треугольной призмы (x, z)
      const verts = [0, 1, 2].map(i => {
        const a = (angleDeg + i * 120) * Math.PI / 180;
        return { x: Math.sin(a) * R, z: -Math.cos(a) * R };
      });

      // Проецируем верхние и нижние вершины
      const top    = verts.map(v => project(v.x, yTop,    v.z));
      const bottom = verts.map(v => project(v.x, yBottom, v.z));

      // Определяем какая грань передняя (ближайшая к зрителю = наибольший z)
      const frontIdx = verts.reduce((best, v, i) => v.z > verts[best].z ? i : best, 0);

      // Рисуем только задние вертикальные рёбра (не принадлежащие передней грани)
      ctx.save();
      ctx.lineWidth = 1;

      [0, 1, 2].forEach(i => {
        if (i === frontIdx) return;

        const depth = (verts[i].z + R) / (2 * R);
        const alpha = 0.08 + depth * 0.12;

        ctx.strokeStyle = `rgba(255,0,0,0.9)`;
        ctx.beginPath();
        ctx.moveTo(top[i].x,    top[i].y);
        ctx.lineTo(bottom[i].x, bottom[i].y);
        ctx.stroke();
      });

      [[0,1],[1,2],[2,0]].forEach(([a, b]) => {
        if (a === frontIdx || b === frontIdx) return;
        ctx.strokeStyle = `rgba(255,0,0,0.9)`;

        ctx.beginPath();
        ctx.moveTo(top[a].x, top[a].y);
        ctx.lineTo(top[b].x, top[b].y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(bottom[a].x, bottom[a].y);
        ctx.lineTo(bottom[b].x, bottom[b].y);
        ctx.stroke();
      });

      ctx.restore();
    }

    // Слушаем изменение угла через MutationObserver на transform h-rotor
    const rotor = document.getElementById('h-rotor');
    if (rotor) {
      // Парсим угол из transform: translateZ(-133px) rotateY(Xdeg)
      function getAngle() {
        const t = rotor.style.transform || '';
        const m = t.match(/rotateY\((-?[\d.]+)deg\)/);
        return m ? parseFloat(m[1]) : 0;
      }

      function update() {
        drawEdges(getAngle());
      }

      new MutationObserver(update).observe(rotor, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', update);
      // Первый рендер после init
      requestAnimationFrame(update);
    }
  })();
  </script>

  
  <script>
  (function() {
    const isMobile = ('ontouchstart' in window) ||
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const turbulence = document.querySelector('#catalog-glass feTurbulence');
    const displacement = document.querySelector('#catalog-glass feDisplacementMap');
    if (!turbulence || !displacement) return;

    // Базовые значения — покой (нет дисплейса)
    const BASE_FREQ  = 0.004;
    const BASE_SCALE = 0;

    // Пиковые значения — крупная волна в середине спина
    const PEAK_FREQ  = 0.012;
    const PEAK_SCALE = isMobile ? 0 : 55;

    let rafId = null;
    let pulseStart = 0;
    let pulseDuration = 700;

    // easeInOut симметричный: нарастает к середине, спадает к концу
    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function pulseTick() {
      const elapsed  = performance.now() - pulseStart;
      const progress = Math.min(elapsed / pulseDuration, 1);

      // Симметричный колокол: 0 → 1 → 0 через sin
      const bell = Math.sin(progress * Math.PI);

      const freq  = BASE_FREQ  + (PEAK_FREQ  - BASE_FREQ)  * bell;
      const scale = BASE_SCALE + (PEAK_SCALE - BASE_SCALE) * bell;

      turbulence.setAttribute('baseFrequency', `${freq.toFixed(4)} ${(freq * 1.1).toFixed(4)}`);
      displacement.setAttribute('scale', scale.toFixed(1));

      if (progress < 1) {
        rafId = requestAnimationFrame(pulseTick);
      } else {
        // Возвращаем в покой
        turbulence.setAttribute('baseFrequency', `${BASE_FREQ} ${(BASE_FREQ * 1.1).toFixed(4)}`);
        displacement.setAttribute('scale', BASE_SCALE);
        rafId = null;
      }
    }

    // Глобальная функция — вызывается из spin()
    window.triggerTurbulencePulse = function(duration) {
      if (rafId) cancelAnimationFrame(rafId);
      pulseDuration = duration || 700;
      pulseStart = performance.now();
      rafId = requestAnimationFrame(pulseTick);
    };
  })();
  </script>
