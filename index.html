<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRISM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif; color: #f0f0f0;
      background-color: #000;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
    }

    @font-face {
      font-family: 'Ageta';
      src: url('https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/main/liquid.italic.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* ── Общий стекляный материал ── */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px) saturate(1.6);
      -webkit-backdrop-filter: blur(12px) saturate(1.6);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 1px 1px 0 rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    /* ── Единый стиль блоков: чёрный фон + inset glow (как у каталога) ── */
    .header-logo,
    .footer-input-face,
    .footer-face {
      background: #000;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06),
        inset 0 0 20px 2px rgba(255,160,0,0.05);
    }

    /* ── Хедер: две колонки 30/70 ── */
    .card-header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 3fr 7fr;
      gap: 8px;
      height: 44px;
      background: transparent;
      position: relative;
      z-index: 2;
    }
    .card-header::after { display: none; }

    /* Лого */
    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .logo {
      font-family: 'Ageta', system-ui, sans-serif;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: #f0f0f0;
      user-select: none;
    }

    /* Хедер-тикер — crossfade между гранями */
    .header-ticker {
      position: relative;
      border-radius: 4px;
      /* box-shadow убран — тикер не должен иметь своего видимого фона/контура */
    }
    /* Перспектива для тикера */
    .header-ticker .footer-input-scene {
      perspective: 300px;
    }
    .ticker-input-rotor {
      width: 100%; height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ticker-face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em;
      color: #888;
      opacity: 0;
      transition: opacity 0.35s ease;
      cursor: pointer;
      text-decoration: none;
    }
    .ticker-face.active { opacity: 1; }
    .ticker-face:hover { color: #f0f0f0; }

    /* Декоративные стрелки на гранях тикера */
    .ticker-arrow {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .ticker-arrow-up { margin-right: 8px; }
    .ticker-arrow-dn { margin-left: 8px; }
    .ticker-text { flex: 1; text-align: center; }

    .tg-link {
      font-size: 13px;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .tg-link:hover { color: #f0f0f0; }

    /* ── Футер: сообщение ── */
    .card-footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 7fr 3fr;
      gap: 8px;
      height: 44px;
      background: transparent;
      overflow: visible;
      position: relative;
      z-index: 2;
    }
    /* Поле ввода — призма с тремя гранями rotateX */
    .footer-prism-wrap {
      overflow: visible;
      position: relative;
      height: 44px;
      background: transparent;
    }
    .footer-input-scene {
      width: 100%;
      height: 44px;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }
    .footer-input-rotor {
      width: 100%;
      height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-input-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #000;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 1px 1px 0 rgba(255,255,255,0.12),
        inset 0 0 12px 2px rgba(80,100,255,0.07),
        inset 0 0 12px 2px rgba(255,60,120,0.04);
      padding: 0 12px;
      border: none;
      font-family: inherit;
      overflow: hidden;
    }

    /* Вертикальный shimmer на футере (rotateX — sweep идёт сверху вниз) */
    .fin-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 5%,
        rgba(255,255,255,0.05) 35%,
        rgba(220,235,255,0.15) 50%,
        rgba(255,255,255,0.05) 65%,
        transparent 95%
      );
      transform: translateY(150%); /* спрятан снизу по умолчанию */
      pointer-events: none;
      z-index: 4; /* под glow (z:5), над контентом */
      border-radius: 4px;
    }
    .footer-input-rotor.spinning .fin-shimmer {
      animation: footer-shimmer 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes footer-shimmer {
      from { transform: translateY(-150%); }
      to   { transform: translateY(150%); }
    }
    .fin-f0 { transform: rotateX(0deg)    translateZ(15px); }
    .fin-f1 { transform: rotateX(-120deg) translateZ(15px); justify-content: center; }
    .fin-f2 { transform: rotateX(-240deg) translateZ(15px); cursor: pointer; }

    .footer-input-face input {
      width: 100%; background: transparent; border: none; outline: none;
      color: #f0f0f0; font-size: 13px; font-family: inherit;
    }
    .footer-input-face input::placeholder { color: #444; }

    .fin-f1-text { font-size: 12px; color: #888; }
    .fin-f2-text { font-size: 12px; color: #a8f0c0; line-height: 1.4; }

    .footer-btn-wrap {
      overflow: visible;
      position: relative;
      height: 44px;
    }
    .footer-scene {
      width: 100%;
      height: 44px;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }
    .footer-rotor {
      width: 100%;
      height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #000;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 1px 1px 0 rgba(255,255,255,0.12),
        inset 0 0 12px 2px rgba(80,100,255,0.07);
      cursor: pointer;
      border: none;
      font-family: inherit;
      outline: none;
      overflow: hidden;
    }
    .footer-f0 { transform: rotateX(0deg)    translateZ(15px); color: #888; }
    .footer-f0:hover { color: #f0f0f0; }
    .footer-f0:disabled { color: #333 !important; opacity: 1 !important; cursor: default; }
    .footer-f1 { transform: rotateX(-120deg) translateZ(15px); color: #a8f0c0; font-size: 11px; }

    /* Shimmer на кнопке пока ждёт ответа */
    .footer-f1-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 10%,
        rgba(255,255,255,0.04) 40%,
        rgba(220,235,255,0.10) 50%,
        rgba(255,255,255,0.04) 60%,
        transparent 90%
      );
      animation: btn-shimmer 1.8s linear infinite;
      pointer-events: none;
    }
    @keyframes btn-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(200%); }
    }

    .card-catalog {
      overflow: visible;
      flex: 1;
      min-height: 0;
      background: #000;
      border-radius: 4px;
    }

    /* ══ ПРИЗМА (ось Y) ══ */
    .h-scene {
      width: 100%;
      height: 100%;
      perspective: 900px;
      perspective-origin: 50% 50%;
    }

    .h-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-133px) rotateY(0deg);
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .h-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #000;
      border-radius: 4px;
      box-shadow:
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06),
        inset 0 0 20px 2px rgba(255,160,0,0.05);
    }

    /* Анимированная дисперсия — паттерн движется, элемент статичен */
    @property --ca {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .border-glow-wrap {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .border-glow {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      padding: 1.25px;
      pointer-events: none;
      transform: scaleX(1.003) scaleY(1.003);
      transform-origin: center center;
      background: conic-gradient(
        from var(--ca) at 50% 50%,
        hsla(300, 20%, 60%, 0.4),
        hsla(275, 20%, 35%, 0.4),
        hsla(0,   0%,  100%, 0.7),
        hsla(0,   0%,   0%, 0.0),
        hsla(240, 20%, 60%, 0.4),
        hsla(180, 20%, 60%, 0.4),
        hsla(0,   0%,   0%, 0.0),
        hsla(120, 20%, 50%, 0.4),
        hsla(0,   0%,  100%, 0.7),
        hsla(0,   0%,   0%, 0.0),
        hsla(60,  20%, 60%, 0.4),
        hsla(30,  20%, 55%, 0.4),
        hsla(0,   20%, 55%, 0.4),
        hsla(300, 20%, 60%, 0.4)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ca-spin 28s linear infinite;
    }

    @keyframes ca-spin {
      from { --ca: 0deg;   }
      to   { --ca: 360deg; }
    }

    /* Вариант для маленьких блоков — неравномерный контур с прозрачными зонами */
    .border-glow-sm {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      padding: 0.8px;
      pointer-events: none;
      background: conic-gradient(
        from var(--ca) at 50% 50%,
        hsla(300, 20%, 55%, 0.0),
        hsla(300, 20%, 55%, 0.45),
        hsla(275, 20%, 40%, 0.35),
        hsla(240, 20%, 55%, 0.0),
        hsla(240, 20%, 55%, 0.0),
        hsla(180, 20%, 60%, 0.40),
        hsla(0,   0%,  100%, 0.70),
        hsla(0,   0%,  100%, 0.70),
        hsla(0,   0%,   0%, 0.0),
        hsla(0,   0%,   0%, 0.0),
        hsla(120, 20%, 50%, 0.35),
        hsla(60,  20%, 55%, 0.0),
        hsla(30,  20%, 55%, 0.40),
        hsla(0,   20%, 55%, 0.45),
        hsla(300, 20%, 55%, 0.0)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ca-spin 40s linear infinite;
    }

    /* SVG стрелки */
    .arrow-icon {
      width: 16px; height: 16px;
      opacity: 0.4;
      flex-shrink: 0;
      pointer-events: none;
    }
    .arrow-icon-down { transform: rotate(180deg); }

    /* Декоративные стрелки тикера */
    .ticker-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .ticker-arrow-up { left: 10px; }
    .ticker-arrow-dn { right: 10px; }
    .ticker-text { flex: 1; text-align: center; }

    /* Анимированный контур для хедера — через JS (border-glow-sm) */
    .header-logo, .header-ticker { position: relative; }

    /* Разные фазы для асинхронности — используется через JS animationDelay */

    /* Контент поверх ::before */
    .header-logo > * { position: relative; z-index: 1; }

    /* Бесконечный shimmer на плашке ожидания */
    .fin-wait-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255,255,255,0.04) 45%,
        rgba(220,235,255,0.10) 50%,
        rgba(255,255,255,0.04) 55%,
        transparent 80%
      );
      animation: fin-wait 2s linear infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes fin-wait {
      from { transform: translateX(-100%); }
      to   { transform: translateX(200%); }
    }
    .h-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 10%,
        rgba(255,255,255,0.05) 35%,
        rgba(220,235,255,0.18) 50%,
        rgba(255,255,255,0.05) 65%,
        transparent 90%
      );
      transform: translateX(-150%);
      pointer-events: none;
      z-index: 10;
    }
    .h-rotor.spinning .h-face::after {
      animation: face-shimmer 0.7s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes face-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(120%); }
    }

    .h-f0 { transform: rotateY(0deg)   translateZ(133px); }
    .h-f1 { transform: rotateY(120deg) translateZ(133px); }
    .h-f2 { transform: rotateY(240deg) translateZ(133px); }

    /* Заголовок — без разделителя, название по центру, стрелки без обводки */
    .face-header {
      padding: 12px 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 3;
      background: transparent;
    }

    .face-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #e0e8ff;
      text-align: center;
      flex: 1;
    }

    /* Кнопки навигации каталога */
    .face-nav-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      transition: opacity 0.15s;
      flex-shrink: 0;
      opacity: 0.5;
      display: flex;
      align-items: center;
    }
    .face-nav-btn:hover { opacity: 1; }
    .face-nav-btn img { width: 13px; height: 13px; filter: invert(1); }
    .face-nav-btn-prev img { transform: rotate(-90deg); }
    .face-nav-btn-next img { transform: rotate(90deg); }

    /* Скролл-область грани */
    .face-scroll-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden; /* clip fade-div-ов чтобы не вылезали за рамку */
    }

    /* fade-out сверху и снизу */
    .fade-top, .fade-bottom {
      position: absolute;
      left: 8.5%; right: 8.5%; /* совпадает с padding face-body — не выходит на glow */
      height: 36px;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }    .fade-top    { top: 0;    background: linear-gradient(to bottom, #000, transparent); }
    .fade-bottom { bottom: 0; background: linear-gradient(to top,   #000, transparent); }
    .fade-top.hidden    { opacity: 0; }
    .fade-bottom.hidden { opacity: 0; }

    .face-body {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 8px 8.5%; /* 15% суммарно по бокам — glow/fade не перекрываются */
    }
    .face-body::-webkit-scrollbar { display: none; }

    /* Подкатегория */
    .sub-block { margin-bottom: 16px; }
    .sub-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #555;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      justify-items: center;
    }

    /* Иконка: 25% от ширины грани.
       Грань = ширина контейнера (~460px на 480px экране).
       25% = ~115px. Используем aspect-ratio чтобы быть квадратными. */
    .prod-icon {
      width: 25%;
      aspect-ratio: 1;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 1px 1px 0 rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.15s;
    }
    .sub-products .prod-icon {
      width: 100%;
    }
    .prod-icon:hover {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), inset 1px 1px 0 rgba(255,255,255,0.2);
    }
    .prod-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pi-ph { font-size: 18px; opacity: 0.15; }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <div class="header-logo">
        <span class="logo">PRISM</span>
      </div>
      <div class="header-ticker">
        <div class="footer-input-scene" style="position:relative">
          <div class="ticker-input-rotor" id="ticker-rotor">
            <div class="footer-input-face fin-f0" data-href="https://t.me/prism3dstore">
              <div class="border-glow-wrap"><div class="border-glow-sm"></div></div>
              <span style="font-size:13px;font-weight:800;color:#f0f0f0;width:100%;text-align:center;position:relative;z-index:1">наш Telegram</span>
            </div>
            <div class="footer-input-face fin-f1" data-href="https://instagram.com/prism3dstore">
              <div class="border-glow-wrap"><div class="border-glow-sm" style="animation-delay:-13s"></div></div>
              <span style="font-size:13px;font-weight:800;color:#f0f0f0;width:100%;text-align:center;position:relative;z-index:1">наш Instagram</span>
            </div>
            <div class="footer-input-face fin-f2" data-href="https://viber.com">
              <div class="border-glow-wrap"><div class="border-glow-sm" style="animation-delay:-26s"></div></div>
              <span style="font-size:13px;font-weight:800;color:#f0f0f0;width:100%;text-align:center;position:relative;z-index:1">наш Viber</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-catalog">
      <div class="h-scene">
        <div class="h-rotor" id="h-rotor"></div>
      </div>
    </div>

    <!-- Футер: призма поля ввода + кнопка отправки -->
    <div class="card-footer">
      <!-- Поле ввода — призма 3 грани -->
      <div class="footer-prism-wrap">
        <div class="footer-input-scene">
          <div class="footer-input-rotor" id="fin-rotor">
            <!-- Грань 0: поле ввода -->
            <div class="footer-input-face fin-f0">
              <div class="fin-shimmer"></div>
              <input type="text" id="footer-input" placeholder="Напишіть нам…" autocomplete="off">
            </div>
            <!-- Грань 1: ожидание ответа -->
            <div class="footer-input-face fin-f1">
              <div class="fin-shimmer"></div>
              <div class="fin-wait-shimmer"></div>
              <span class="fin-f1-text">Очікування відповіді оператора…</span>
            </div>
            <!-- Грань 2: ответ оператора -->
            <div class="footer-input-face fin-f2" id="fin-reply">
              <div class="fin-shimmer"></div>
              <span class="fin-f2-text" id="fin-reply-text"></span>
            </div>
          </div>
        </div>
      </div>
      <!-- Кнопка отправки — призма -->
      <div class="footer-btn-wrap">
        <div class="footer-scene">
          <div class="footer-rotor" id="footer-rotor">
            <button class="footer-face footer-f0" id="footer-send">Відправити</button>
            <div class="footer-face footer-f1"><div class="footer-f1-shimmer"></div>✓</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="catalog.js"></script>
  <script>
    const R = 133;
    // Накапливаем угол — не сбрасываем в 0..360, крутим в нужную сторону
    let angle = 0;

    async function init() {
      const data = await loadCatalog();
      const cats = data.categories;
      const rotor = document.getElementById('h-rotor');

      cats.forEach((cat, i) => {
        const face = document.createElement('div');
        face.className = `h-face h-f${i}`;
        face.style.transform = `rotateY(${i * 120}deg) translateZ(${R}px)`;

        // Анимированная дисперсия по периметру — добавляется В КОНЦЕ чтобы быть поверх fade
        const glowWrap = document.createElement('div');
        glowWrap.className = 'border-glow-wrap';
        const glow = document.createElement('div');
        glow.className = 'border-glow';
        glowWrap.appendChild(glow);
        // НЕ добавляем сюда — добавим после scrollWrap

        // Заголовок
        const header = document.createElement('div');
        header.className = 'face-header';
        header.innerHTML = `
          <button class="face-nav-btn face-nav-btn-prev" data-dir="-1"><img src="https://www.svgrepo.com/show/466811/up-sign.svg" alt="prev"></button>
          <span class="face-title">${cat.name}</span>
          <button class="face-nav-btn face-nav-btn-next" data-dir="1"><img src="https://www.svgrepo.com/show/466811/up-sign.svg" alt="next"></button>
        `;
        header.querySelectorAll('.face-nav-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            spin(parseInt(btn.dataset.dir));
          });
        });
        face.appendChild(header);

        // Скролл-обёртка с fade
        const scrollWrap = document.createElement('div');
        scrollWrap.className = 'face-scroll-wrap';

        // Fade-элементы
        const fadeTop = document.createElement('div');
        fadeTop.className = 'fade-top';
        const fadeBot = document.createElement('div');
        fadeBot.className = 'fade-bottom';
        scrollWrap.appendChild(fadeTop);
        scrollWrap.appendChild(fadeBot);

        const body = document.createElement('div');
        body.className = 'face-body';

        cat.subcategories.forEach(sub => {
          const block = document.createElement('div');
          block.className = 'sub-block';
          block.innerHTML = `<div class="sub-title">${sub.name}</div>`;

          const grid = document.createElement('div');
          grid.className = 'sub-products';

          sub.products.forEach(p => {
            const icon = document.createElement('div');
            icon.className = 'prod-icon';
            icon.onclick = () => location.href = `product.html?id=${p.id}`;
            // Тонкий анимированный контур
            const gw = document.createElement('div'); gw.className = 'border-glow-wrap';
            const gg = document.createElement('div'); gg.className = 'border-glow-sm';
            gg.style.animationDelay = `${-(Math.random()*40).toFixed(1)}s`;
            gw.appendChild(gg); icon.appendChild(gw);
            icon.innerHTML += p.thumbnail
              ? `<img src="${p.thumbnail}" alt="${p.name}" loading="lazy"
                   onerror="this.parentElement.innerHTML='<span class=pi-ph>⬡</span>'">`
              : `<span class="pi-ph">⬡</span>`;
            grid.appendChild(icon);
          });

          block.appendChild(grid);
          body.appendChild(block);
        });

        scrollWrap.appendChild(body);
        face.appendChild(scrollWrap);
        // glow добавляется ПОСЛЕ scrollWrap — рисуется поверх fade (который внутри scrollWrap)
        face.appendChild(glowWrap);
        rotor.appendChild(face);

        // Fade исчезает когда список упирается в край
        function updateFade() {
          const { scrollTop, scrollHeight, clientHeight } = body;
          fadeTop.classList.toggle('hidden', scrollTop < 8);
          fadeBot.classList.toggle('hidden', scrollTop + clientHeight >= scrollHeight - 8);
        }
        body.addEventListener('scroll', updateFade, { passive: true });
        requestAnimationFrame(updateFade);
      });

      // Вращаем в нужную сторону, накапливая угол (инвертировано)
      function spin(dir) {
        angle -= dir * 120;
        rotor.style.transform = `translateZ(-${R}px) rotateY(${angle}deg)`;
        // Shimmer
        rotor.classList.add('spinning');
        setTimeout(() => rotor.classList.remove('spinning'), 700);
      }

      // Свайп
      let tx = 0;
      document.querySelector('.card-catalog').addEventListener('touchstart', e => {
        tx = e.touches[0].clientX;
      }, { passive: true });
      document.querySelector('.card-catalog').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 40) spin(dx < 0 ? 1 : -1);
      });

      // Начальное состояние
      rotor.style.transform = `translateZ(-${R}px) rotateY(0deg)`;
    }

    init();

    // Добавляем анимированный контур на хедер-лого (тонкий вариант)
    (function() {
      // Хедер-лого
      const logo = document.querySelector('.header-logo');
      if (logo) {
        const wrap = document.createElement('div');
        wrap.className = 'border-glow-wrap';
        const g = document.createElement('div');
        g.className = 'border-glow-sm';
        g.style.animationDelay = '-7s';
        wrap.appendChild(g); logo.appendChild(wrap);
      }
      // Грани кнопки "Відправити"
      document.querySelectorAll('.footer-face').forEach((face, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'border-glow-wrap';
        const g = document.createElement('div');
        g.className = 'border-glow-sm';
        g.style.animationDelay = `${-14 - i*5}s`;
        wrap.appendChild(g); face.appendChild(wrap);
      });
      // Грани поля ввода (только настоящие, не тикер)
      document.querySelectorAll('#fin-rotor .footer-input-face').forEach((face, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'border-glow-wrap';
        const g = document.createElement('div');
        g.className = 'border-glow-sm';
        g.style.animationDelay = `${-20 - i*4}s`;
        wrap.appendChild(g); face.appendChild(wrap);
      });
    })();

    // Тикер — призма rotateX, клик = флип, долгое нажатие = открыть ссылку
    (function() {
      const tickerWrap = document.querySelector('.header-ticker');
      const tickerRotor = document.getElementById('ticker-rotor');
      if (!tickerWrap || !tickerRotor) return;

      let tickerAngle = 0;
      let pressStart = 0;
      let faceIndex = 0;
      const faces = tickerRotor.querySelectorAll('[data-href]');

      tickerWrap.addEventListener('pointerdown', () => { pressStart = Date.now(); });
      tickerWrap.addEventListener('pointerup', () => {
        const held = Date.now() - pressStart;
        if (held > 400 && faces[faceIndex]) {
          window.open(faces[faceIndex].dataset.href, '_blank');
        } else {
          tickerAngle -= 120;
          faceIndex = (faceIndex + 1) % faces.length;
          tickerRotor.style.transform = `translateZ(-15px) rotateX(${tickerAngle}deg)`;
        }
      });
    })();

    // ── Логика футера (чат с оператором) ──────────────────────────────────
    (function() {
      const finRotor  = document.getElementById('fin-rotor');
      const input     = document.getElementById('footer-input');
      const sendBtn   = document.getElementById('footer-send');
      const replyText = document.getElementById('fin-reply-text');

      let finAngle = 0;
      let chatFace = 0;
      let pollTimer = null;

      // session_id — уникальный для каждой сессии браузера
      let session = sessionStorage.getItem('chat_session');
      if (!session) {
        session = Math.random().toString(36).slice(2) + Date.now().toString(36);
        sessionStorage.setItem('chat_session', session);
      }

      function spinField(face) {
        chatFace = face;
        finAngle = Math.round(finAngle / 360) * 360 + face * 120;
        finRotor.style.transform = `translateZ(-15px) rotateX(${finAngle}deg)`;
        // Shimmer — reflow сбрасывает анимацию перед повторным запуском
        finRotor.classList.remove('spinning');
        void finRotor.offsetWidth;
        finRotor.classList.add('spinning');
        setTimeout(() => finRotor.classList.remove('spinning'), 520);
      }

      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(async () => {
          try {
            const r    = await fetch(`/api/chat-poll?s=${session}`);
            const data = await r.json();
            if (data.reply) {
              stopPolling();
              replyText.textContent = data.reply;
              spinField(2);
              sendBtn.textContent  = 'Відповісти';
              sendBtn.disabled     = false;
              sendBtn.style.opacity = '1';
            }
          } catch(e) {}
        }, 2000);
      }

      function stopPolling() {
        clearInterval(pollTimer);
        pollTimer = null;
      }

      sendBtn.addEventListener('click', async () => {
        if (chatFace === 2) {
          // Новая сессия + переход на грань 0 следующего цикла (вперёд, не назад)
          session = Math.random().toString(36).slice(2) + Date.now().toString(36);
          sessionStorage.setItem('chat_session', session);
          // Текущий угол = base + 240. Грань 0 следующего цикла = base + 360.
          // Значит крутим на +120 вперёд
          finAngle += 120;
          finRotor.style.transform = `translateZ(-15px) rotateX(${finAngle}deg)`;
          chatFace = 0;
          sendBtn.textContent = 'Відправити';
          setTimeout(() => input.focus(), 520);
          return;
        }

        const msg = input.value.trim();
        if (!msg) return;

        spinField(1);
        sendBtn.disabled = true;
        input.value = '';

        try {
          await fetch('/api/chat-send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, session }),
          });
        } catch(e) { console.error(e); }

        startPolling();
      });

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendBtn.click();
      });
    })();
  </script>
</body>
</html>
