<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — каталог</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-frame">

    <div class="frame-card">
      <header class="site-header">
        <div class="site-logo">3D Store</div>
      </header>
    </div>

    <div class="frame-card catalog-card">
      <div class="cat-nav">
        <button class="cat-nav-btn" id="cat-prev">←</button>
        <span class="cat-nav-title" id="cat-title">Пластик</span>
        <button class="cat-nav-btn" id="cat-next">→</button>
      </div>
      <div class="cat-viewport">
        <div class="cat-track" id="cat-track">
          <!-- грани генерирует JS -->
        </div>
      </div>
    </div>

  </div>
  <script src="catalog.js"></script>
  <script src="main.js"></script>
</body>
</html>
