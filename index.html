<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRISM</title>
  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif; color: #f0f0f0;
      background-color: #000;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
    }

    @font-face {
      font-family: 'Ageta';
      src: url('https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/main/liquid.italic.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* ── Общий стекляный материал ── */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px) saturate(1.6);
      -webkit-backdrop-filter: blur(12px) saturate(1.6);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 1px 1px 0 rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    /* ── Единый стиль блоков: полупрозрачный фон + искажение + inset glow ── */
    .header-logo,
    .footer-input-face,
    .footer-face {
      background: rgba(0, 0, 0, 0.60);
      -webkit-backdrop-filter: url(#catalog-glass);
      backdrop-filter: url(#catalog-glass);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06),
        inset 0 0 20px 2px rgba(255,160,0,0.05);
    }

    /* Лого — glow вдвое слабее */
    .header-logo {
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.05),
        inset 0 0 20px 2px rgba(255,60,120,0.03),
        inset 0 0 20px 2px rgba(255,160,0,0.025);
    }

    /* ── Хедер: две колонки 30/70 ── */
    .card-header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 3fr 7fr;
      gap: 8px;
      height: 44px;
      background: transparent;
      position: relative;
      z-index: 1;
    }
    .card-header::after { display: none; }

    /* Лого */
    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .logo {
      font-family: 'Ageta', system-ui, sans-serif;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: #f0f0f0;
      user-select: none;
    }

    /* Хедер-тикер */
    .header-ticker {
      position: relative;
      border-radius: 4px;
      animation: ticker-rock 3.5s ease-in-out infinite;
    }
    @keyframes ticker-rock {
      0%, 100% { transform: perspective(300px) rotateX(0deg); }
      30%       { transform: perspective(300px) rotateX(6deg); }
      70%       { transform: perspective(300px) rotateX(-6deg); }
    }

    /* Фоновый слой с overflow:hidden — клипает шиммер, не мешает 3D */
    .ticker-bg {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    /* Диагональный шиммер внутри bg-слоя */
    .ticker-sheen {
      position: absolute; inset: 0;
      background: linear-gradient(
        105deg,
        transparent 25%,
        rgba(255,255,255,0.05) 48%,
        rgba(255,255,255,0.09) 50%,
        transparent 72%
      );
      animation: ticker-sheen-anim 4.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes ticker-sheen-anim {
      0%         { transform: translateX(-150%); }
      60%, 100%  { transform: translateX(250%); }
    }

    /* Стрелки тикера — большие, внутри граней, вращаются вместе */
    .ticker-arrow-wrap {
      display: none;
    }
    .ticker-arrow-big {
      font-size: 18px;
      line-height: 1;
      color: rgba(255,255,255,0.35);
      flex-shrink: 0;
      pointer-events: none;
      user-select: none;
    }
    /* Перспектива для тикера */
    .header-ticker .footer-input-scene {
      perspective: 300px;
      position: relative;
      z-index: 1;
    }
    .ticker-input-rotor {
      width: 100%; height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ticker-face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em;
      color: #888;
      opacity: 0;
      transition: opacity 0.35s ease;
      cursor: pointer;
      text-decoration: none;
    }
    .ticker-face.active { opacity: 1; }
    .ticker-face:hover { color: #f0f0f0; }

    /* Декоративные стрелки на гранях тикера */
    .ticker-arrow {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .ticker-arrow-up { margin-right: 8px; }
    .ticker-arrow-dn { margin-left: 8px; }
    .ticker-text { flex: 1; text-align: center; }

    .tg-link {
      font-size: 13px;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .tg-link:hover { color: #f0f0f0; }

    /* ── Футер: сообщение ── */
    .card-footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 7fr 3fr;
      gap: 8px;
      height: 44px;
      background: transparent;
      overflow: visible;
      position: relative;
      z-index: 2;
    }
    /* Поле ввода — призма с тремя гранями rotateX */
    .footer-prism-wrap {
      overflow: visible;
      position: relative;
      height: 44px;
      background: transparent;
    }
    .footer-input-scene {
      width: 100%;
      height: 44px;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }
    .footer-input-rotor {
      width: 100%;
      height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-input-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 0 12px;
      border: none;
      font-family: inherit;
      overflow: hidden;
    }

    /* Вертикальный shimmer на футере (rotateX — sweep идёт сверху вниз) */
    .fin-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 5%,
        rgba(255,255,255,0.05) 35%,
        rgba(220,235,255,0.15) 50%,
        rgba(255,255,255,0.05) 65%,
        transparent 95%
      );
      transform: translateY(150%); /* спрятан снизу по умолчанию */
      pointer-events: none;
      z-index: 4; /* под glow (z:5), над контентом */
      border-radius: 4px;
    }
    .footer-input-rotor.spinning .fin-shimmer {
      animation: footer-shimmer 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes footer-shimmer {
      from { transform: translateY(-150%); }
      to   { transform: translateY(150%); }
    }
    .fin-f0 { transform: rotateX(0deg)    translateZ(15px); }
    .fin-f1 { transform: rotateX(-120deg) translateZ(15px); justify-content: center; }
    .fin-f2 { transform: rotateX(-240deg) translateZ(15px); cursor: pointer; }

    .footer-input-face input {
      width: 100%; background: transparent; border: none; outline: none;
      color: #f0f0f0; font-size: 13px; font-family: inherit;
    }
    .footer-input-face input::placeholder { color: #444; }

    .fin-f1-text { font-size: 12px; color: #888; }
    .fin-f2-text { font-size: 12px; color: #ffe066; line-height: 1.4; }

    .footer-btn-wrap {
      overflow: visible;
      position: relative;
      height: 44px;
    }
    .footer-scene {
      width: 100%;
      height: 44px;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }
    .footer-rotor {
      width: 100%;
      height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-15px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: rgba(0, 0, 0, 0.60);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.12),
        inset 0 0 20px 2px rgba(255,60,120,0.07),
        inset 0 0 20px 2px rgba(255,160,0,0.05);
      cursor: pointer;
      border: none;
      font-family: inherit;
      outline: none;
      overflow: hidden;
    }
    .footer-f0 { transform: rotateX(0deg)    translateZ(15px); color: #888; }
    .footer-f0:hover { color: #f0f0f0; }
    .footer-f0:disabled { color: #333 !important; opacity: 1 !important; cursor: default; }
    .footer-f1 { transform: rotateX(-120deg) translateZ(15px); color: #a8f0c0; font-size: 11px; }

    /* Shimmer на кнопке пока ждёт ответа */
    .footer-f1-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 10%,
        rgba(255,255,255,0.04) 40%,
        rgba(220,235,255,0.10) 50%,
        rgba(255,255,255,0.04) 60%,
        transparent 90%
      );
      animation: btn-shimmer 1.8s linear infinite;
      pointer-events: none;
    }
    @keyframes btn-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(200%); }
    }

    .card-catalog {
      overflow: visible;
      flex: 1;
      min-height: 0;
      background: transparent;
      border-radius: 4px;
      position: relative;
      z-index: 3;
    }

    /* ══ ПРИЗМА (ось Y) ══ */
    .h-scene {
      width: 100%;
      height: 100%;
      perspective: 900px;
      perspective-origin: 50% 50%;
    }

    .h-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-133px) rotateY(0deg);
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Направленный blur — убран */

    .h-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.60);
      -webkit-backdrop-filter: url(#catalog-glass);
      backdrop-filter: url(#catalog-glass);
      border-radius: 4px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06),
        inset 0 0 20px 2px rgba(255,160,0,0.05);
    }
    /* убираем пустой before */

    /* Анимированная дисперсия — паттерн движется, элемент статичен */
    @property --ca {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .border-glow-wrap {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .border-glow {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      padding: 1.25px;
      pointer-events: none;
      transform: scaleX(1.003) scaleY(1.003);
      transform-origin: center center;
      background: conic-gradient(
        from var(--ca) at 50% 50%,
        hsla(300, 20%, 60%, 0.4),
        hsla(275, 20%, 35%, 0.4),
        hsla(0,   0%,  100%, 0.7),
        hsla(0,   0%,   0%, 0.0),
        hsla(240, 20%, 60%, 0.4),
        hsla(180, 20%, 60%, 0.4),
        hsla(0,   0%,   0%, 0.0),
        hsla(120, 20%, 50%, 0.4),
        hsla(0,   0%,  100%, 0.7),
        hsla(0,   0%,   0%, 0.0),
        hsla(60,  20%, 60%, 0.4),
        hsla(30,  20%, 55%, 0.4),
        hsla(0,   20%, 55%, 0.4),
        hsla(300, 20%, 60%, 0.4)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ca-spin 28s linear infinite;
    }

    @keyframes ca-spin {
      from { --ca: 0deg;   }
      to   { --ca: 360deg; }
    }

    /* Вариант для маленьких блоков — неравномерный контур с прозрачными зонами */
    .border-glow-sm {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      padding: 0.8px;
      pointer-events: none;
      background: conic-gradient(
        from var(--ca) at 50% 50%,
        hsla(300, 20%, 55%, 0.0),
        hsla(300, 20%, 55%, 0.45),
        hsla(275, 20%, 40%, 0.35),
        hsla(240, 20%, 55%, 0.0),
        hsla(240, 20%, 55%, 0.0),
        hsla(180, 20%, 60%, 0.40),
        hsla(0,   0%,  100%, 0.70),
        hsla(0,   0%,  100%, 0.70),
        hsla(0,   0%,   0%, 0.0),
        hsla(0,   0%,   0%, 0.0),
        hsla(120, 20%, 50%, 0.35),
        hsla(60,  20%, 55%, 0.0),
        hsla(30,  20%, 55%, 0.40),
        hsla(0,   20%, 55%, 0.45),
        hsla(300, 20%, 55%, 0.0)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ca-spin 40s linear infinite;
    }

    /* SVG стрелки */
    .arrow-icon {
      width: 16px; height: 16px;
      opacity: 0.4;
      flex-shrink: 0;
      pointer-events: none;
    }
    .arrow-icon-down { transform: rotate(180deg); }

    /* Декоративные стрелки тикера */
    .ticker-arrow-up { left: 10px; }
    .ticker-arrow-dn { right: 10px; }
    .ticker-text { flex: 1; text-align: center; }

    /* Анимированный контур для хедера — через JS (border-glow-sm) */
    .header-logo, .header-ticker { position: relative; }

    /* Разные фазы для асинхронности — используется через JS animationDelay */

    /* Контент поверх ::before */
    .header-logo > * { position: relative; z-index: 1; }

    /* Бесконечный shimmer на плашке ожидания */
    .fin-wait-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255,255,255,0.04) 45%,
        rgba(220,235,255,0.10) 50%,
        rgba(255,255,255,0.04) 55%,
        transparent 80%
      );
      animation: fin-wait 2s linear infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes fin-wait {
      from { transform: translateX(-100%); }
      to   { transform: translateX(200%); }
    }
    .h-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 10%,
        rgba(255,255,255,0.05) 35%,
        rgba(220,235,255,0.18) 50%,
        rgba(255,255,255,0.05) 65%,
        transparent 90%
      );
      transform: translateX(-150%);
      pointer-events: none;
      z-index: 10;
    }
    .h-rotor.spinning .h-face::after {
      animation: face-shimmer 0.7s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes face-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(120%); }
    }

    .h-f0 { transform: rotateY(0deg)   translateZ(133px); }
    .h-f1 { transform: rotateY(120deg) translateZ(133px); }
    .h-f2 { transform: rotateY(240deg) translateZ(133px); }

    /* Заголовок — без разделителя, название по центру, стрелки без обводки */
    .face-header {
      padding: 12px 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 3;
      background: transparent;
    }

    .face-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #e0e8ff;
      text-align: center;
      flex: 1;
      /* Лёгкая хроматическая аберрация — эффект 3D на контуре */
      text-shadow:
        -0.5px 0 0.5px rgba(255, 80, 80, 0.55),
         0.5px 0 0.5px rgba(80, 160, 255, 0.55);
    }

    /* Кнопки навигации каталога */
    .face-nav-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      transition: opacity 0.15s;
      flex-shrink: 0;
      opacity: 0.5;
      display: flex;
      align-items: center;
    }
    .face-nav-btn:hover { opacity: 1; }
    .face-nav-btn img { width: 13px; height: 13px; filter: invert(1); }
    .face-nav-btn-prev img { transform: rotate(-90deg); }
    .face-nav-btn-next img { transform: rotate(90deg); }

    /* Скролл-область грани */
    .face-scroll-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      margin-bottom: 40px;
      /* fade через mask — работает даже в 3D-контексте */
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        black 28px,
        black calc(100% - 28px),
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        black 28px,
        black calc(100% - 28px),
        transparent 100%
      );
    }
    /* fade сверху скрыт когда в начале */
    .face-scroll-wrap.at-top {
      -webkit-mask-image: linear-gradient(
        to bottom,
        black 0px,
        black calc(100% - 28px),
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        black 0px,
        black calc(100% - 28px),
        transparent 100%
      );
    }
    /* fade снизу скрыт когда в конце */
    .face-scroll-wrap.at-bottom {
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        black 28px,
        black 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        black 28px,
        black 100%
      );
    }
    /* оба скрыты */
    .face-scroll-wrap.at-top.at-bottom {
      -webkit-mask-image: none;
      mask-image: none;
    }

    .face-body {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 8px 8.5% 80px;
    }
    .face-body::-webkit-scrollbar { display: none; }

    /* Подкатегория */
    .sub-block { margin-bottom: 16px; }
    .sub-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      justify-items: center;
    }

    /* Иконка: 25% от ширины грани.
       Грань = ширина контейнера (~460px на 480px экране).
       25% = ~115px. Используем aspect-ratio чтобы быть квадратными. */
    .prod-icon {
      width: 25%;
      aspect-ratio: 1;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 1px 1px 0 rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      transition: box-shadow 0.15s;
    }
    .sub-products .prod-icon {
      width: 100%;
      position: relative;
    }
    .prod-icon-name {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 4px 4px 2px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;

  <!-- ── 3D превью в иконках каталога ── -->
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { RGBELoader }  from 'three/addons/loaders/RGBELoader.js';

  // ── Детект мобильного устройства ──────────────────────────────────────
  // Используем User-Agent + ontouchstart, не hardwareConcurrency
  // (современные телефоны имеют 8+ ядер и проходят проверку как десктоп)
  const IS_MOBILE = ('ontouchstart' in window) ||
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const IS_LOW_END = IS_MOBILE;

  // ── Размер тайла рендертаргета (px) ────────────────────────────────────
  const TILE = IS_LOW_END ? 128 : 256;

  // Один рендерер на всё
  const renderer = new THREE.WebGLRenderer({ antialias: !IS_LOW_END, alpha: true });
  renderer.setPixelRatio(IS_LOW_END ? 1 : Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping      = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  // Скрытый canvas рендерера — маленький, offscreen
  renderer.setSize(TILE, TILE);
  renderer.domElement.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;pointer-events:none;';
  document.body.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 50);
  // Изометрический ракурс: направление камеры (нормализованный вектор)
  // theta=45° по XZ, phi=35.26° вверх (истинная изометрия)
  const CAM_DIR = new THREE.Vector3(1, 1, 1).normalize(); // от origin к камере

  // Освещение
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.8);
  key.position.set(3, 5, 4);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
  fill.position.set(-4, 1, 2);
  scene.add(fill);

  // HDR env — только на десктопе (на мобиле ~2MB и лишняя задержка)
  if (!IS_MOBILE) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    new RGBELoader().setDataType(THREE.FloatType).load(
      'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
      hdr => {
        scene.environment = pmrem.fromEquirectangular(hdr).texture;
        hdr.dispose(); pmrem.dispose();
      },
      undefined, () => pmrem.dispose()
    );
  }

  // GLTF / DRACO лоадер
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
  const gltfLoader = new GLTFLoader();
  gltfLoader.setDRACOLoader(draco);

  // Кеш моделей: url → THREE.Group (клонируется для каждой иконки)
  const modelCache = new Map();

  // Список всех иконок для рендер-цикла
  // { canvas, mesh, rotY, visible }
  const icons = [];

  // IntersectionObserver — рендерим только видимые
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const item = icons.find(i => i.canvas === e.target);
      if (item) item.visible = e.isIntersecting;
    });
  }, { threshold: 0.1 });

  // ── Регистрация иконки ──────────────────────────────────────────────────
  async function register(canvas, modelUrl, accentHex, isWax = false) {
    // Размер canvas = размер иконки в CSS px * dpr
    const dpr  = IS_LOW_END ? 1 : Math.min(devicePixelRatio, 2);
    const size = TILE;
    canvas.width  = size;
    canvas.height = size;
    const ctx2d = canvas.getContext('2d');

    // Placeholder — спиннер
    ctx2d.fillStyle = 'rgba(255,255,255,0.04)';
    ctx2d.fillRect(0, 0, size, size);

    const color = accentHex ? new THREE.Color(accentHex) : new THREE.Color(isWax ? 0xe8b86d : 0x27ae60);

    // Загружаем или берём из кеша
    let gltfScene;
    if (modelCache.has(modelUrl)) {
      gltfScene = modelCache.get(modelUrl).clone(true);
    } else {
      try {
        const gltf = await new Promise((res, rej) =>
          gltfLoader.load(modelUrl, res, undefined, rej)
        );
        modelCache.set(modelUrl, gltf.scene);
        gltfScene = gltf.scene.clone(true);
      } catch(e) {
        gltfScene = new THREE.Mesh(
          new THREE.TorusKnotGeometry(0.3, 0.1, 64, 16),
          new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0 })
        );
      }
    }

    // Материал — восковой шейдер (для Свечей) или матовый/глянец пластик
    let mat;
    if (isWax) {
      mat = new THREE.MeshPhysicalMaterial({
        color,
        roughness: 0.55,
        metalness: 0.0,
        clearcoat: 0.10,
        clearcoatRoughness: 0.35,
        sheen: 0.40,
        sheenColor: new THREE.Color(0xffffff),
        sheenRoughness: 0.30,
        transmission: 0.03,
        thickness: 0.25,
        ior: 1.48
      });
    } else {
      mat = new THREE.MeshStandardMaterial({ color, roughness: 0.88, metalness: 0.0 });
    }
    gltfScene.traverse(c => { if (c.isMesh) { c.material = mat; c.castShadow = false; } });

    // ── Пересчёт масштаба и идеальное центрирование строго в (0, 0, 0) ─────
    gltfScene.position.set(0, 0, 0);
    gltfScene.scale.setScalar(1);

    // 1. Вычисляем точные габариты исходной модели
    const box0 = new THREE.Box3().setFromObject(gltfScene);
    const size0 = box0.getSize(new THREE.Vector3());
    const maxDim = Math.max(size0.x, size0.y, size0.z) || 1.0;

    // 2. Масштабируем так, чтобы модель идеально вписывалась в ячейку
    const normScale = 1.6 / maxDim;
    gltfScene.scale.setScalar(normScale);

    // 3. Сдвигаем геометрию так, чтобы центр BoundingBox был точно в (0, 0, 0)
    const box1 = new THREE.Box3().setFromObject(gltfScene);
    const center1 = box1.getCenter(new THREE.Vector3());
    gltfScene.position.x = -center1.x;
    gltfScene.position.y = -center1.y;
    gltfScene.position.z = -center1.z;

    // pivot — только вращение вокруг своей центральной оси (0, 0, 0)
    const pivot = new THREE.Group();
    pivot.position.set(0, 0, 0);
    pivot.add(gltfScene);

    const camDist = FIXED_CAM_DIST;
    // На мобиле — статичный стоп-кадр: рендерим один раз и останавливаем
    const isStatic = IS_LOW_END;
    icons.push({ canvas, ctx2d, mesh: pivot, rotY: Math.random() * Math.PI * 2, visible: false, camDist, isStatic, rendered: false });
    io.observe(canvas);
  }

  // ── Рендер-цикл ────────────────────────────────────────────────────────
  // На слабых девайсах рендерим реже
  const FRAME_SKIP = IS_LOW_END ? 3 : 1;
  let frameCount = 0;
  const ROT_SPEED = IS_LOW_END ? 0.008 : 0.012;

  // Изометрическая камера строго нацелена на (0, 0, 0)
  const FIXED_CAM_DIST = 3.2;
  camera.position.set(2.0, 1.8, 2.0);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();

  function tick() {
    requestAnimationFrame(tick);
    frameCount++;
    if (frameCount % FRAME_SKIP !== 0) return;

    for (const item of icons) {
      if (!item.visible) continue;
      // Статичный режим (мобиле): рендерим только один раз
      if (item.isStatic && item.rendered) continue;

      item.rotY += ROT_SPEED;
      item.mesh.rotation.y = item.rotY;

      scene.add(item.mesh);
      renderer.render(scene, camera);
      scene.remove(item.mesh);

      item.ctx2d.clearRect(0, 0, TILE, TILE);
      item.ctx2d.drawImage(renderer.domElement, 0, 0);
      item.rendered = true;
    }
  }

  tick();

  // Экспортируем глобально — вызывается из init() который не module
  window.CatalogViewer3D = { register };
  // Сигнализируем что готовы
  if (window._catalogViewer3DResolve) window._catalogViewer3DResolve({ register });
  </script>

    // Тикер — призма rotateX, клик = флип, долгое нажатие = открыть ссылку
    (function() {

      const tickerRotor = document.getElementById('ticker-rotor');

      let tickerAngle = 0;

      let faceIndex = 0;
      const faces = tickerRotor.querySelectorAll('[data-href]');

      tickerWrap.addEventListener('pointerdown', () => { pressStart = Date.now(); });
      tickerWrap.addEventListener('pointerup', () => {
        const held = Date.now() - pressStart;

    // ── Логика футера (чат с оператором) ──────────────────────────────────
    (function() {

      const input     = document.getElementById('footer-input');
      const sendBtn   = document.getElementById('footer-send');
      const replyText = document.getElementById('fin-reply-text');

      let finAngle = 0;
      let chatFace = 0;
      let pollTimer = null;

      // session_id — уникальный для каждой сессии браузера
      let session = sessionStorage.getItem('chat_session');
      if (!session) {
        session = Math.random().toString(36).slice(2) + Date.now().toString(36);
        sessionStorage.setItem('chat_session', session);
      }

      function spinField(face) {
        chatFace = face;
        finAngle = Math.round(finAngle / 360) * 360 + face * 120;
        finRotor.style.transform = `translateZ(-15px) rotateX(${finAngle}deg)`;
        // Shimmer — reflow сбрасывает анимацию перед повторным запуском
        finRotor.classList.remove('spinning');
        void finRotor.offsetWidth;
        finRotor.classList.add('spinning');
        setTimeout(() => finRotor.classList.remove('spinning'), 520);
      }

      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(async () => {
          try {
            const r    = await fetch(`/api/chat-poll?s=${session}`);
            const data = await r.json();
            if (data.reply) {
              stopPolling();
              replyText.textContent = data.reply;
              spinField(2);
              sendBtn.textContent  = 'Відповісти';
              sendBtn.disabled     = false;
              sendBtn.style.opacity = '1';
            }
          } catch(e) {}
        }, 2000);
      }

      function stopPolling() {
        clearInterval(pollTimer);
        pollTimer = null;
      }

      sendBtn.addEventListener('click', async () => {
        if (chatFace === 2) {
          // Новая сессия + переход на грань 0 следующего цикла (вперёд, не назад)
          session = Math.random().toString(36).slice(2) + Date.now().toString(36);
          sessionStorage.setItem('chat_session', session);
          // Текущий угол = base + 240. Грань 0 следующего цикла = base + 360.
          // Значит крутим на +120 вперёд
          finAngle += 120;
          finRotor.style.transform = `translateZ(-15px) rotateX(${finAngle}deg)`;
          chatFace = 0;
          sendBtn.textContent = 'Відправити';
          setTimeout(() => input.focus(), 520);
          return;
        }

        const msg = input.value.trim();
        if (!msg) return;

        spinField(1);
        sendBtn.disabled = true;
        input.value = '';

        try {
          await fetch('/api/chat-send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, session }),
          });
        } catch(e) { console.error(e); }

        startPolling();
      });

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendBtn.click();
      });
    })();

  <!-- SVG фильтр: квадратная линза — центр ровный, края искажены -->
  <!-- SVG фильтр для преломления + motion blur при вращении -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="catalog-glass" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.010" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- Motion blur — убран -->
    </defs>
  </svg>

  <script>
  // ── Рёбра задних граней призмы ──
  (function() {
    const canvas = document.getElementById('prism-edges');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const R = 133; // радиус вписанной окружности (translateZ)
    const perspective = 900;

    // Синхронизируемся с текущим углом h-rotor через CSS transform
    let currentAngle = 0; // в градусах, совпадает с angle в init()

    function project(x, y, z) {
      // Точно как CSS perspective: 900px, perspective-origin: 50% 50%
      // h-rotor: translateZ(-133px), грань: translateZ(+133px) → суммарно z=0 для передней
      // Добавляем translateZ(-133px) ротора к z грани
      const d = 900; // perspective
      const zTotal = z - R; // translateZ(-R) от ротора + translateZ(z) грани
      const scale = d / (d - zTotal);
      return {
        x: canvas.width  / 2 + x * scale,
        y: canvas.height / 2 + y * scale,
      };
    }

    function drawEdges(angleDeg) {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const H = canvas.height;
      const yTop    = -H / 2;
      const yBottom =  H / 2;

      // 3 вершины треугольной призмы (x, z)
      const verts = [0, 1, 2].map(i => {
        const a = (angleDeg + i * 120) * Math.PI / 180;
        return { x: Math.sin(a) * R, z: -Math.cos(a) * R };
      });

      // Проецируем верхние и нижние вершины
      const top    = verts.map(v => project(v.x, yTop,    v.z));
      const bottom = verts.map(v => project(v.x, yBottom, v.z));

      // Определяем какая грань передняя (ближайшая к зрителю = наибольший z)
      const frontIdx = verts.reduce((best, v, i) => v.z > verts[best].z ? i : best, 0);

      // Рисуем только задние вертикальные рёбра (не принадлежащие передней грани)
      ctx.save();
      ctx.lineWidth = 1;

      [0, 1, 2].forEach(i => {
        if (i === frontIdx) return;

        const depth = (verts[i].z + R) / (2 * R);
        const alpha = 0.08 + depth * 0.12;

        ctx.strokeStyle = `rgba(255,0,0,0.9)`;
        ctx.beginPath();
        ctx.moveTo(top[i].x,    top[i].y);
        ctx.lineTo(bottom[i].x, bottom[i].y);
        ctx.stroke();
      });

      [[0,1],[1,2],[2,0]].forEach(([a, b]) => {
        if (a === frontIdx || b === frontIdx) return;
        ctx.strokeStyle = `rgba(255,0,0,0.9)`;

        ctx.beginPath();
        ctx.moveTo(top[a].x, top[a].y);
        ctx.lineTo(top[b].x, top[b].y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(bottom[a].x, bottom[a].y);
        ctx.lineTo(bottom[b].x, bottom[b].y);
        ctx.stroke();
      });

      ctx.restore();
    }

    // Слушаем изменение угла через MutationObserver на transform h-rotor
    const rotor = document.getElementById('h-rotor');
    if (rotor) {
      // Парсим угол из transform: translateZ(-133px) rotateY(Xdeg)
      function getAngle() {
        const t = rotor.style.transform || '';
        const m = t.match(/rotateY\((-?[\d.]+)deg\)/);
        return m ? parseFloat(m[1]) : 0;
      }

      function update() {
        drawEdges(getAngle());
      }

      new MutationObserver(update).observe(rotor, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', update);
      // Первый рендер после init
      requestAnimationFrame(update);
    }
  })();
  </script>

  <!-- ── Анимация мигающих точек в узлах сетки ── -->
  <script>
  (function() {
    const canvas = document.getElementById('grid-dots');
    if (!canvas) return;
    const ctx  = canvas.getContext('2d');
    const GRID = 40;
    const isMob = ('ontouchstart' in window) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const MAX_DOTS = isMob ? 18 : 55;

    let W, H, cols, rows, dots = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cols = Math.floor(W / GRID) + 1;
      rows = Math.floor(H / GRID) + 1;
    }
    window.addEventListener('resize', resize);
    resize();

    function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

    function spawnDot() {
      return {
        col:      randInt(0, cols),
        row:      randInt(0, rows),
        alpha:    0,
        maxAlpha: 0.55 + Math.random() * 0.45,
        radius:   0.35 + Math.random() * 0.42,
        phase:    'in',
        speed:    0.012 + Math.random() * 0.018,
        hold:     0,
        maxHold:  randInt(18, 80),
      };
    }

    for (let i = 0; i < MAX_DOTS; i++) {
      const d = spawnDot();
      d.alpha = Math.random() * d.maxAlpha;
      d.phase = ['in','hold','out'][randInt(0,2)];
      dots.push(d);
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      dots.forEach((d, idx) => {
        if (d.phase === 'in') {
          d.alpha += d.speed;
          if (d.alpha >= d.maxAlpha) { d.alpha = d.maxAlpha; d.phase = 'hold'; }
        } else if (d.phase === 'hold') {
          d.hold++;
          if (d.hold >= d.maxHold) d.phase = 'out';
        } else {
          d.alpha -= d.speed * 0.7;
          if (d.alpha <= 0) { dots[idx] = spawnDot(); return; }
        }
        const x = d.col * GRID;
        const y = d.row * GRID;
        ctx.save();
        const glow = ctx.createRadialGradient(x, y, 0, x, y, d.radius * 4);
        glow.addColorStop(0,   `rgba(180,180,180,${d.alpha * 0.5})`);
        glow.addColorStop(0.5, `rgba(140,140,140,${d.alpha * 0.15})`);
        glow.addColorStop(1,   `rgba(0,0,0,0)`);
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(x, y, d.radius * 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(200,200,200,${d.alpha * 0.7})`;
        ctx.beginPath(); ctx.arc(x, y, d.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(tick);
    }
    tick();
  })();
  </script>

  <!-- ── Турбуленс дисплейс: только во время spin-анимации каталога ── -->
  <script>
  (function() {
    const isMobile = ('ontouchstart' in window) ||
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const turbulence = document.querySelector('#catalog-glass feTurbulence');
    const displacement = document.querySelector('#catalog-glass feDisplacementMap');
    if (!turbulence || !displacement) return;

    // Базовые значения — покой (нет дисплейса)
    const BASE_FREQ  = 0.004;
    const BASE_SCALE = 0;

    // Пиковые значения — крупная волна в середине спина
    const PEAK_FREQ  = 0.012;
    const PEAK_SCALE = isMobile ? 0 : 55;

    let rafId = null;
    let pulseStart = 0;
    let pulseDuration = 700;

    // easeInOut симметричный: нарастает к середине, спадает к концу
    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function pulseTick() {
      const elapsed  = performance.now() - pulseStart;
      const progress = Math.min(elapsed / pulseDuration, 1);

      // Симметричный колокол: 0 → 1 → 0 через sin
      const bell = Math.sin(progress * Math.PI);

      const freq  = BASE_FREQ  + (PEAK_FREQ  - BASE_FREQ)  * bell;
      const scale = BASE_SCALE + (PEAK_SCALE - BASE_SCALE) * bell;

      turbulence.setAttribute('baseFrequency', `${freq.toFixed(4)} ${(freq * 1.1).toFixed(4)}`);
      displacement.setAttribute('scale', scale.toFixed(1));

      if (progress < 1) {
        rafId = requestAnimationFrame(pulseTick);
      } else {
        // Возвращаем в покой
        turbulence.setAttribute('baseFrequency', `${BASE_FREQ} ${(BASE_FREQ * 1.1).toFixed(4)}`);
        displacement.setAttribute('scale', BASE_SCALE);
        rafId = null;
      }
    }

    // Глобальная функция — вызывается из spin()
    window.triggerTurbulencePulse = function(duration) {
      if (rafId) cancelAnimationFrame(rafId);
      pulseDuration = duration || 700;
      pulseStart = performance.now();
      rafId = requestAnimationFrame(pulseTick);
    };
  })();
  </script>
