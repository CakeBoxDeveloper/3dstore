<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — каталог</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site-frame">

  <div class="frame-card header-card">
    <header class="site-header">
      <div class="site-logo">3D Store</div>
    </header>
  </div>

  <div class="frame-card content-card">
    <main class="catalog-wrap">
      <h1 class="page-title">Каталог</h1>
      <p class="page-subtitle">Изделия, напечатанные на 3D принтере и изготовленные вручную</p>
      <div id="catalog-root"></div>
    </main>
  </div>

</div>

  <script src="catalog.js"></script>
  <script src="main.js"></script>
</body>
</html>
