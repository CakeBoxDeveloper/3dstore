<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — каталог</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #080808; }
    body { font-family: system-ui, sans-serif; color: #f0f0f0; }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ══ Стеклянный стиль блоков (по мотивам 3d.html) ══ */

    /* Хедер */
    .card-header {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
      padding: 12px 16px;
    }
    .card-header::after { display: none; }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }

    .card-catalog {
      overflow: visible;
      flex: 1;
      min-height: 0;
    }

    /* ══ ПРИЗМА (ось Y) ══ */
    .h-scene {
      width: 100%;
      height: 100%;
      perspective: 900px;
      perspective-origin: 50% 50%;
    }

    .h-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-133px) rotateY(0deg);
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Грань призмы */
    .h-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #161a22;
      box-shadow: none;
    }
    .h-face::after { display: none; }

    /* Шиммер — отдельный div .face-shimmer внутри грани (добавляется JS) */
    .face-shimmer {
      position: absolute;
      top: -50%;
      left: -150%;
      width: 80%;
      height: 200%;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,255,0.05) 48%,
        rgba(255,255,255,0.08) 50%,
        rgba(255,255,255,0.05) 52%,
        transparent 70%
      );
      animation: shimmer-diag 5s ease-in-out infinite;
    }

    @keyframes shimmer-diag {
      0%   { transform: translateX(0%); }
      100% { transform: translateX(340%); }
    }

    .h-f0 { transform: rotateY(0deg)   translateZ(133px); }
    .h-f1 { transform: rotateY(120deg) translateZ(133px); }
    .h-f2 { transform: rotateY(240deg) translateZ(133px); }

    /* Заголовок — без разделителя, название по центру, стрелки без обводки */
    .face-header {
      padding: 12px 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* нет border-bottom */
    }

    .face-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #e0e8ff;
      text-align: center;
      flex: 1;
    }

    /* Стрелки — просто символ, без фона и обводки */
    .face-nav-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .face-nav-btn:hover { color: #fff; }

    /* Скролл-область грани с fade сверху и снизу */
    .face-scroll-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* fade-out сверху и снизу — отдельные div .fade-top / .fade-bottom */
    .fade-top, .fade-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 36px;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .fade-top    { top: 0;    background: linear-gradient(to bottom, #161a22, transparent); }
    .fade-bottom { bottom: 0; background: linear-gradient(to top,    #161a22, transparent); }
    .fade-top.hidden    { opacity: 0; }
    .fade-bottom.hidden { opacity: 0; }

    .face-body {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 8px 12px 12px;
    }
    .face-body::-webkit-scrollbar { display: none; }

    /* Подкатегория */
    .sub-block { margin-bottom: 16px; }
    .sub-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #555;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      justify-items: center;
    }

    /* Иконка: 25% от ширины грани.
       Грань = ширина контейнера (~460px на 480px экране).
       25% = ~115px. Используем aspect-ratio чтобы быть квадратными. */
    .prod-icon {
      width: 25%;
      aspect-ratio: 1;
      background: #242424;
      border: 1px solid #2e2e2e;
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    /* В grid — ширина задаётся grid, переопределяем */
    .sub-products .prod-icon {
      width: 100%;
    }
    .prod-icon:hover { border-color: #555; }
    .prod-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pi-ph { font-size: 18px; opacity: 0.15; }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <span class="logo">3D Store</span>
    </div>

    <div class="card-catalog">
      <div class="h-scene">
        <div class="h-rotor" id="h-rotor"></div>
      </div>
    </div>

  </div>

  <script src="catalog.js"></script>
  <script>
    const R = 133;
    // Накапливаем угол — не сбрасываем в 0..360, крутим в нужную сторону
    let angle = 0;

    async function init() {
      const data = await loadCatalog();
      const cats = data.categories;
      const rotor = document.getElementById('h-rotor');

      cats.forEach((cat, i) => {
        const face = document.createElement('div');
        face.className = `h-face h-f${i}`;
        face.style.transform = `rotateY(${i * 120}deg) translateZ(${R}px)`;

        // Заголовок
        const header = document.createElement('div');
        header.className = 'face-header';
        header.innerHTML = `
          <button class="face-nav-btn" data-dir="-1">‹</button>
          <span class="face-title">${cat.name}</span>
          <button class="face-nav-btn" data-dir="1">›</button>
        `;
        header.querySelectorAll('.face-nav-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            spin(parseInt(btn.dataset.dir));
          });
        });
        face.appendChild(header);

        // Скролл-обёртка с fade
        const scrollWrap = document.createElement('div');
        scrollWrap.className = 'face-scroll-wrap';

        // Шиммер (под fade)
        const shimmer = document.createElement('div');
        shimmer.className = 'face-shimmer';
        scrollWrap.appendChild(shimmer);

        // Fade-элементы поверх шиммера
        const fadeTop = document.createElement('div');
        fadeTop.className = 'fade-top';
        const fadeBot = document.createElement('div');
        fadeBot.className = 'fade-bottom';
        scrollWrap.appendChild(fadeTop);
        scrollWrap.appendChild(fadeBot);

        const body = document.createElement('div');
        body.className = 'face-body';

        cat.subcategories.forEach(sub => {
          const block = document.createElement('div');
          block.className = 'sub-block';
          block.innerHTML = `<div class="sub-title">${sub.name}</div>`;

          const grid = document.createElement('div');
          grid.className = 'sub-products';

          sub.products.forEach(p => {
            const icon = document.createElement('div');
            icon.className = 'prod-icon';
            icon.onclick = () => location.href = `product.html?id=${p.id}`;
            icon.innerHTML = p.thumbnail
              ? `<img src="${p.thumbnail}" alt="${p.name}" loading="lazy"
                   onerror="this.parentElement.innerHTML='<span class=pi-ph>⬡</span>'">`
              : `<span class="pi-ph">⬡</span>`;
            grid.appendChild(icon);
          });

          block.appendChild(grid);
          body.appendChild(block);
        });

        scrollWrap.appendChild(body);
        face.appendChild(scrollWrap);
        rotor.appendChild(face);

        // Fade исчезает когда список упирается в край
        function updateFade() {
          const { scrollTop, scrollHeight, clientHeight } = body;
          fadeTop.classList.toggle('hidden', scrollTop < 8);
          fadeBot.classList.toggle('hidden', scrollTop + clientHeight >= scrollHeight - 8);
        }
        body.addEventListener('scroll', updateFade, { passive: true });
        requestAnimationFrame(updateFade);
      });

      // Вращаем в нужную сторону, накапливая угол
      function spin(dir) {
        angle += dir * 120;
        rotor.style.transform = `translateZ(-${R}px) rotateY(${angle}deg)`;
      }

      // Свайп
      let tx = 0;
      document.querySelector('.card-catalog').addEventListener('touchstart', e => {
        tx = e.touches[0].clientX;
      }, { passive: true });
      document.querySelector('.card-catalog').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 40) spin(dx < 0 ? 1 : -1);
      });

      // Начальное состояние
      rotor.style.transform = `translateZ(-${R}px) rotateY(0deg)`;
    }

    init();
  </script>
</body>
</html>
