<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — каталог</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #080808; }
    body { font-family: system-ui, sans-serif; color: #f0f0f0; }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    .card-header {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
    }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }

    .card-catalog {
      overflow: visible;
      flex: 1;
      min-height: 0;
    }

    /* ══ ПРИЗМА (ось Y) ══ */
    .h-scene {
      width: 100%;
      height: 100%;
      perspective: 900px;
      perspective-origin: 50% 50%;
    }

    .h-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-133px) rotateY(0deg);
      transition: transform 0.9s cubic-bezier(0.25, 0.1, 0.25, 1),
                  opacity   0.15s ease-out;
    }

    .h-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #161a22;
    }

    .h-f0 { transform: rotateY(0deg)   translateZ(133px); }
    .h-f1 { transform: rotateY(120deg) translateZ(133px); }
    .h-f2 { transform: rotateY(240deg) translateZ(133px); }

    .face-header {
      padding: 12px 14px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e0e8ff;
    }

    .face-nav-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 15px;
      width: 30px; height: 30px;
      cursor: pointer;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .face-nav-btn:hover { background: rgba(255,255,255,0.12); }

    .face-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 12px 16px 16px;
    }
    .face-body::-webkit-scrollbar { display: none; }

    .sub-block { margin-bottom: 20px; }
    .sub-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #666;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .prod-icon {
      aspect-ratio: 1;
      background: #242424;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .prod-icon:hover { border-color: #666; }
    .prod-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pi-ph { font-size: 18px; opacity: 0.15; }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <span class="logo">3D Store</span>
    </div>

    <div class="card-catalog">
      <div class="h-scene">
        <div class="h-rotor" id="h-rotor"></div>
      </div>
    </div>

  </div>

  <script src="catalog.js"></script>
  <script>
    const R = 133;
    let current = 0;

    async function init() {
      const data = await loadCatalog();
      const cats = data.categories;
      const rotor = document.getElementById('h-rotor');

      const angles = [0, 120, 240];
      cats.forEach((cat, i) => {
        const face = document.createElement('div');
        face.className = `h-face h-f${i}`;
        face.style.transform = `rotateY(${angles[i]}deg) translateZ(${R}px)`;

        const header = document.createElement('div');
        header.className = 'face-header';
        header.innerHTML = `
          <button class="face-nav-btn" data-dir="-1">←</button>
          <span>${cat.name}</span>
          <button class="face-nav-btn" data-dir="1">→</button>
        `;
        header.querySelectorAll('.face-nav-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            goTo(current + parseInt(btn.dataset.dir));
          });
        });
        face.appendChild(header);

        const body = document.createElement('div');
        body.className = 'face-body';

        cat.subcategories.forEach(sub => {
          const block = document.createElement('div');
          block.className = 'sub-block';
          block.innerHTML = `<div class="sub-title">${sub.name}</div>`;

          const grid = document.createElement('div');
          grid.className = 'sub-products';

          sub.products.forEach(p => {
            const icon = document.createElement('div');
            icon.className = 'prod-icon';
            icon.onclick = () => location.href = `product.html?id=${p.id}`;
            icon.innerHTML = p.thumbnail
              ? `<img src="${p.thumbnail}" alt="${p.name}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=pi-ph>⬡</span>'">`
              : `<span class="pi-ph">⬡</span>`;
            grid.appendChild(icon);
          });

          block.appendChild(grid);
          body.appendChild(block);
        });

        face.appendChild(body);
        rotor.appendChild(face);
      });

      function goTo(idx) {
        current = ((idx % 3) + 3) % 3;
        // opacity flash — motion blur без filter
        rotor.style.opacity = '0.3';
        rotor.style.transform = `translateZ(-${R}px) rotateY(${-current * 120}deg)`;
        setTimeout(() => { rotor.style.opacity = '1'; }, 160);
      }

      // Свайп
      let tx = 0;
      document.querySelector('.card-catalog').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
      document.querySelector('.card-catalog').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 40) dx < 0 ? goTo(current + 1) : goTo(current - 1);
      });

      goTo(0);
    }

    init();
  </script>
</body>
</html>
