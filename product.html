<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — товар</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #080808; }
    body { font-family: system-ui, sans-serif; color: #f0f0f0; }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ── Хедер: стекло ── */
    .card-header {
      position: relative;
      flex-shrink: 0;
      padding: 12px 16px;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
    }
    .card-header::after { display: none; }
    .back-link {
      font-size: 14px;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
      justify-self: start;
    }
    .back-link:hover { color: #f0f0f0; }
    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Контент ── */
    .card-content {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 14px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }
    .card-content::after { display: none; }

    .product-page {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 14px;
    }
    .product-page::-webkit-scrollbar { display: none; }

    .viewer-wrap {
      background: #242424;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    #viewer-canvas { width: 100%; aspect-ratio: 1; display: block; }

    .viewer-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #242424; font-size: 13px; color: #888;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #2e2e2e; border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .product-name-price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .product-name-big  { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
    .product-price-big { font-size: 17px; font-weight: 700; color: #c8f0a0; white-space: nowrap; flex-shrink: 0; }

    /* ── Слайдер материалов — по ширине вьювера ── */
    .material-section { margin-bottom: 4px; }
    .material-slider-outer {
      position: relative;
      /* не выходим за края — ширина = ширина вьювера (без отрицательных маргинов) */
    }
    .material-slider-wrap  { overflow-x: auto; scrollbar-width: none; }
    .material-slider-wrap::-webkit-scrollbar { display: none; }
    .material-slider { display: flex; gap: 7px; width: max-content; padding-bottom: 4px; }

    .material-slider-outer::before,
    .material-slider-outer::after {
      content: ''; position: absolute; top: 0; bottom: 4px;
      width: 28px; z-index: 2; pointer-events: none; transition: opacity 0.2s;
    }
    .material-slider-outer::before { left: 0;  background: linear-gradient(to right, #1a1a1a, transparent); }
    .material-slider-outer::after  { right: 0; background: linear-gradient(to left,  #1a1a1a, transparent); }
    .material-slider-outer.at-start::before { opacity: 0; }
    .material-slider-outer.at-end::after    { opacity: 0; }

    .mat-chip {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 7px 9px; min-width: 62px;
      background: #242424; border: 1.5px solid #2e2e2e; border-radius: 9px;
      cursor: pointer; font-family: inherit;
      transition: border-color 0.15s; flex-shrink: 0;
    }
    .mat-chip:hover  { border-color: #666; }
    .mat-chip.active { border-color: #f0f0f0; background: #2a2a2a; }
    .mat-chip-swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
    .mat-chip-label  { font-size: 10px; font-weight: 600; color: #f0f0f0; white-space: nowrap; }
    .mat-chip-sub    { font-size: 9px; color: #888; white-space: nowrap; }

    /* ── Призма-кнопка (ось X, вращается вверх) ── */
    .card-order {
      overflow: visible;
      background: transparent;
      border: none;
      flex-shrink: 0;
      height: 52px;
    }

    .v-scene {
      width: 100%;
      height: 52px;
      perspective: 400px;
      perspective-origin: 50% 50%;
    }

    .v-rotor {
      width: 100%;
      height: 52px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-17px) rotateX(0deg);
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .v-face {
      position: absolute;
      inset: 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .v-f0 {
      transform: rotateX(0deg) translateZ(17px);
      background: #1a5276;
      color: #fff;
      cursor: pointer;
      border: none;
      width: 100%;
      font-family: inherit;
    }
    .v-f0:hover { background: #1f618d; }

    .v-f1 {
      transform: rotateX(-120deg) translateZ(17px);
      background: #1c2c3e;
      border: 1.5px solid #2d4a6a;
      padding: 0 16px;
    }
    .v-f1 input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .v-f1 input::placeholder { color: rgba(255,255,255,0.3); }
    .v-f1.invalid { box-shadow: inset 0 0 0 1.5px #e74c3c; }

    .v-f2 {
      transform: rotateX(-240deg) translateZ(17px);
      background: #1a3a28;
      border: 1.5px solid #27ae60;
      color: #c8f0a0;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <a href="index.html" class="back-link">← Назад</a>
      <span class="logo">3D Store</span>
      <span></span><!-- правая колонка для баланса grid -->
    </div>

    <div class="card-content">
      <main class="product-page">
        <div class="viewer-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-loader" id="viewer-loader">
            <div class="spinner"></div> Загрузка…
          </div>
        </div>

        <div class="product-name-price-row">
          <div class="product-name-big" id="p-name">—</div>
          <div class="product-price-big" id="p-price">—</div>
        </div>

        <div class="material-section">
          <div class="material-slider-outer" id="slider-outer">
            <div class="material-slider-wrap" id="slider-wrap">
              <div class="material-slider" id="material-slider"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Призма-кнопка -->
    <div class="card-order">
      <div class="v-scene" id="order-scene">
        <div class="v-rotor" id="order-rotor">
          <button class="v-face v-f0" id="face-order">Заказати</button>
          <div class="v-face v-f1" id="face-phone">
            <input type="tel" id="phone-input"
              placeholder="+380XXXXXXXXX"
              autocomplete="tel" inputmode="tel">
          </div>
          <div class="v-face v-f2" id="face-success">Заявка прийнята!</div>
        </div>
      </div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
    }
  }
  </script>
  <script src="catalog.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
