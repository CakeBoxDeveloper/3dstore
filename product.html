<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — товар</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #080808; }
    body { font-family: system-ui, sans-serif; color: #f0f0f0; }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ── Хедер — одна строка ── */
    .card-header {
      flex-shrink: 0;
      padding: 12px 16px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
    }
    .back-link {
      font-size: 14px;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
      justify-self: start;
    }
    .back-link:hover { color: #f0f0f0; }
    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Контент — фиксированный, не растягивается ── */
    .card-content {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .product-page {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
    }
    .product-page::-webkit-scrollbar { display: none; }

    /* Вьювер — уменьшен (4:3 вместо 1:1) */
    .viewer-wrap {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    #viewer-canvas { width: 100%; aspect-ratio: 4 / 3; display: block; }

    .viewer-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1e1e1e; font-size: 13px; color: #888;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #2e2e2e; border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .product-name-row { margin-bottom: 8px; flex-shrink: 0; }
    .product-name-big  { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
    .product-sizes     { font-size: 12px; color: #666; margin-top: 2px; }

    /* ── Слайдер материалов ── */
    .material-section { margin-bottom: 8px; flex-shrink: 0; }
    .material-slider-outer { position: relative; }
    .material-slider-wrap  { overflow-x: auto; scrollbar-width: none; }
    .material-slider-wrap::-webkit-scrollbar { display: none; }
    .material-slider { display: flex; gap: 7px; width: max-content; padding-bottom: 4px; }

    .material-slider-outer::before,
    .material-slider-outer::after {
      content: ''; position: absolute; top: 0; bottom: 4px;
      width: 24px; z-index: 2; pointer-events: none; transition: opacity 0.2s;
    }
    .material-slider-outer::before { left: 0;  background: linear-gradient(to right, #1a1a1a, transparent); }
    .material-slider-outer::after  { right: 0; background: linear-gradient(to left,  #1a1a1a, transparent); }
    .material-slider-outer.at-start::before { opacity: 0; }
    .material-slider-outer.at-end::after    { opacity: 0; }

    .mat-chip {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 4px 5px;
      min-width: 48px;
      background: transparent; border: 1.5px solid #2e2e2e; border-radius: 4px;
      cursor: pointer; font-family: inherit;
      transition: border-color 0.15s; flex-shrink: 0;
    }
    .mat-chip:hover  { border-color: #666; }
    .mat-chip.active { border-color: #f0f0f0; }
    .mat-chip-color {
      width: 40px; height: 26px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .mat-chip-type {
      font-size: 8px; font-weight: 800; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }
    /* подпись цвета убрана */

    /* ── Тумблер ── */
    .procedural-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 0;
      font-size: 12px;
      color: #666;
      flex-shrink: 0;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2e2e2e;
      border-radius: 11px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #555;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #1a5276; }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: #fff;
    }

    /* ── Призма-кнопка ── */
    .card-order {
      overflow: visible;
      background: transparent;
      border: none;
      flex-shrink: 0;
      height: 52px;
    }

    .v-scene {
      width: 100%;
      height: 52px;
      perspective: 400px;
      perspective-origin: 50% 50%;
    }

    .v-rotor {
      width: 100%;
      height: 52px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-17px) rotateX(0deg);
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .v-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      gap: 6px;
      /* Дисперсионное стекло — тёмный центр + радужные края */
      background:
        radial-gradient(ellipse at 50% 50%, #050710 40%, transparent 100%),
        conic-gradient(
          from var(--btn-hue, 0deg) at 50% 50%,
          #ff0040 0deg,
          #ff6600 60deg,
          #ffdd00 120deg,
          #00cfff 180deg,
          #7040ff 240deg,
          #ff00cc 300deg,
          #ff0040 360deg
        );
      border: none;
      overflow: hidden;
    }

    @property --btn-hue {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    .v-face { animation: btn-hue-spin 6s linear infinite; }

    @keyframes btn-hue-spin {
      to { --btn-hue: 360deg; }
    }

    /* Виньетка поверх — прямоугольная, края светятся */
    .v-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,  transparent 12%, rgba(3,5,10,0.97) 22%, rgba(3,5,10,0.97) 78%, transparent 88%),
        linear-gradient(to bottom, transparent 10%, rgba(3,5,10,0.97) 22%, rgba(3,5,10,0.97) 78%, transparent 90%);
      box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.2);
      pointer-events: none;
      z-index: 0;
      border-radius: 4px;
    }

    /* Текст поверх виньетки */
    .v-face > * { position: relative; z-index: 1; }

    .v-f0 {
      transform: rotateX(0deg) translateZ(17px);
      color: #fff;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      flex-direction: row;
      gap: 5px;
    }
    .v-f0:hover::after { opacity: 0.85; }
    .v-f0-top { font-size: 14px; font-weight: 700; white-space: nowrap; color: #fff; }
    .v-f0-sub { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; }

    .v-f1 {
      transform: rotateX(-120deg) translateZ(17px);
      color: #fff;
      padding: 0 16px;
    }
    .v-f1 input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }
    .v-f1 input::placeholder { color: rgba(255,255,255,0.45); }
    .v-f1.invalid::after { box-shadow: inset 0 0 0 1.5px #e74c3c; }

    .v-f2 {
      transform: rotateX(-240deg) translateZ(17px);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <a href="index.html" class="back-link">← Назад в каталог</a>
    </div>

    <div class="card-content">
      <main class="product-page">

        <div class="viewer-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-loader" id="viewer-loader">
            <div class="spinner"></div> Загрузка…
          </div>
        </div>

        <!-- Название + размеры -->
        <div class="product-name-row">
          <div class="product-name-big" id="p-name">—</div>
          <div class="product-sizes" id="p-sizes"></div>
        </div>

        <div class="material-section">
          <div class="material-slider-outer" id="slider-outer">
            <div class="material-slider-wrap" id="slider-wrap">
              <div class="material-slider" id="material-slider"></div>
            </div>
          </div>
        </div>

        <div class="procedural-toggle">
          <span>Процедурна генерація</span>
          <label class="toggle-switch">
            <input type="checkbox" id="proc-toggle">
            <span class="toggle-track"></span>
          </label>
        </div>

      </main>
    </div>

    <!-- Кнопка заказа — отдельная карточка с ценой внутри -->
    <div class="card-order">
      <div class="v-scene" id="order-scene">
        <div class="v-rotor" id="order-rotor">
          <button class="v-face v-f0" id="face-order">
            <span class="v-f0-top" id="btn-order-label">Заказати</span>
            <span class="v-f0-sub" id="btn-order-price"></span>
          </button>
          <div class="v-face v-f1" id="face-phone">
            <input type="tel" id="phone-input"
              placeholder="+380XXXXXXXXX"
              autocomplete="tel" inputmode="tel">
          </div>
          <div class="v-face v-f2" id="face-success">Заявка прийнята!</div>
        </div>
      </div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
      "three/addons/loaders/RGBELoader.js": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/RGBELoader.js"
    }
  }
  </script>
  <script src="catalog.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
