<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — товар</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-product">

  <div class="site-frame">

    <!-- Хедер -->
    <div class="frame-card header-card">
      <header class="site-header">
        <div class="site-logo">3D Store</div>
      </header>
    </div>

    <!-- Контент товара -->
    <div class="frame-card content-card">
      <main class="product-page">
        <a href="index.html" class="back-link">← Назад</a>

        <div class="viewer-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-loader" id="viewer-loader">
            <div class="spinner"></div> Загрузка…
          </div>
        </div>

        <div class="product-info-block">
          <div class="product-name-price-row">
            <div class="product-name-big" id="p-name">—</div>
            <div class="product-price-big" id="p-price">—</div>
          </div>
        </div>

        <div class="material-section">
          <div class="material-slider-outer" id="slider-outer">
            <div class="material-slider-wrap" id="slider-wrap">
              <div class="material-slider" id="material-slider"></div>
            </div>
          </div>
        </div>

      </main>
    </div>

    <!-- Кнопка заказа — отдельная карточка -->
    <div class="frame-card order-card">
      <div class="order-block" id="order-block">
        <div class="prism-scene">
          <div class="prism-rotor" id="prism-rotor">
            <button class="prism-face prism-face-0" id="face-order">Заказать</button>
            <div class="prism-face prism-face-1" id="face-phone">
              <input type="tel" id="phone-input" placeholder="+380 XX XXX XX XX" autocomplete="tel" inputmode="tel">
              <span class="phone-arrow" id="phone-arrow">→</span>
            </div>
            <div class="prism-face prism-face-2" id="face-confirm">
              <button class="btn-back" id="btn-back">← Назад</button>
              <button class="btn-go" id="btn-go">Підтвердити</button>
            </div>
          </div>
        </div>
        <div class="order-success-toast" id="success-toast">
          ✅ Замовлення відправлено! Зв'яжемося з вами.
        </div>
      </div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
    }
  }
  </script>
  <script src="catalog.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
