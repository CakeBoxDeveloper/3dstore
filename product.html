<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — товар</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif; color: #f0f0f0;
      background-color: #000;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ── Хедер — одна строка ── */
    @font-face {
      font-family: 'Ageta';
      src: url('https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/main/liquid.italic.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    .card-header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 3fr 7fr;
      gap: 8px;
      height: 44px;
      background: transparent;
    }

    .header-back, .header-next, .back-link, .next-model-btn {
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      background: rgba(10,10,15,0.55);
      border-radius: 4px;
    }
    .back-link {
      display: flex; align-items: center; justify-content: center;
      padding: 0 12px; font-size: 13px; font-weight: 700; color: #f0f0f0;
      text-decoration: none; transition: color 0.15s;
      background: #000; border-radius: 4px; white-space: nowrap;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 16px 2px rgba(80,100,255,0.10),
        inset 0 0 16px 2px rgba(255,60,120,0.06);
    }
    .back-link:hover { color: #fff; }

    .next-model-btn {
      display: flex; align-items: center; justify-content: center;
      padding: 0 12px; font-size: 13px; font-weight: 700; color: #f0f0f0;
      background: #000; border: none; border-radius: 4px;
      cursor: pointer; font-family: inherit; transition: color 0.15s;
      text-align: center; position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 16px 2px rgba(80,100,255,0.10),
        inset 0 0 16px 2px rgba(255,160,0,0.06);
    }
    .next-model-btn:hover { color: #fff; }
    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Контент — фиксированный, не растягивается ── */
    .card-content {
      background: #000;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 24px 4px rgba(80,100,255,0.10),
        inset 0 0 24px 4px rgba(255,60,120,0.06),
        inset 0 0 24px 4px rgba(255,160,0,0.05);
      border-radius: 4px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Вьювер — -10% по ширине и высоте */
    .viewer-wrap {
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin: 0 5% 10px;
      flex-shrink: 0;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06);
    }
    #viewer-canvas { width: 100%; aspect-ratio: 16 / 10; display: block; }

    .viewer-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; font-size: 13px; color: #888;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #2e2e2e; border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .product-name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 5% 8px;
      flex-shrink: 0;
    }

    /* ── Слайдер материалов ── */
    .material-section { margin: 0 5% 8px; flex-shrink: 0; }
    .product-name-big { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
    .product-sizes    { font-size: 11px; color: #666; white-space: nowrap; flex-shrink: 0; }

    .product-page {
      height: 100%;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none;
      padding: 10px 14px 14px;
      display: flex; flex-direction: column;
      background: #000;
    }
    .product-page::-webkit-scrollbar { display: none; }

    .material-slider-outer { position: relative; }
    .material-slider-wrap  { overflow-x: auto; scrollbar-width: none; }
    .material-slider-wrap::-webkit-scrollbar { display: none; }
    .material-slider { display: flex; gap: 7px; width: max-content; padding-bottom: 4px; }

    .material-slider-outer::before,
    .material-slider-outer::after {
      content: ''; position: absolute; top: 0; bottom: 4px;
      width: 24px; z-index: 2; pointer-events: none; transition: opacity 0.2s;
    }
    .material-slider-outer::before { left: 0;  background: linear-gradient(to right, #000, transparent); z-index: 1; }
    .material-slider-outer::after  { right: 0; background: linear-gradient(to left,  #000, transparent); z-index: 1; }
    .material-slider-outer.at-start::before { opacity: 0; }
    .material-slider-outer.at-end::after    { opacity: 0; }

    .mat-chip {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 4px 5px;
      min-width: 48px;
      background: transparent; border: 1.5px solid #2e2e2e; border-radius: 4px;
      cursor: pointer; font-family: inherit;
      transition: border-color 0.15s; flex-shrink: 0;
    }
    .mat-chip:hover  { border-color: #666; }
    .mat-chip.active { border-color: #f0f0f0; }
    .mat-chip-color {
      width: 40px; height: 26px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .mat-chip-type {
      font-size: 8px; font-weight: 800; letter-spacing: 0.05em;
      /* Цвет текста = фон родителя — эффект "дырки" */
      mix-blend-mode: luminosity;
      color: #000;
      opacity: 0.55;
    }
    /* подпись цвета убрана */

    /* ── Тумблер ── */
    .procedural-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 4px;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      margin: 4px 5%;  /* -10% по ширине как вьюпорт */
      flex-direction: column;
      gap: 6px;
      background: #000;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 14px 2px rgba(80,100,255,0.08);
      position: relative;
    }
    .procedural-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .procedural-hint {
      font-size: 11px;
      color: #a0a8b0;
      padding-bottom: 4px;
      width: 100%;
      line-height: 1.4;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2e2e2e;
      border-radius: 11px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #555;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #1a5276; }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: #fff;
    }

    /* ── Призма-кнопка — CSS с двухслойным фоном ── */
    .card-order {
      overflow: visible;
      background: transparent;
      border: none;
      flex-shrink: 0;
      height: 52px;
    }

    .v-scene {
      width: 100%;
      height: 52px;
      perspective: 400px;
      perspective-origin: 50% 50%;
    }

    .v-rotor {
      width: 100%;
      height: 52px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-17px) rotateX(0deg);
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Грань: жидкое стекло через SVG filter */
    .v-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      gap: 6px;
      background: transparent;
      outline: none;
      border: none;
    }

    /* Слой 1: glow + контур */
    .v-face::before {
      content: '';
      position: absolute; inset: 0; border-radius: 4px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.10),
        inset 0 0 20px 3px rgba(80,100,255,0.12),
        inset 0 0 20px 3px rgba(255,60,120,0.07);
      background: #000;
      z-index: 0;
    }

    /* Слой 2: жидкое стекло через SVG filter */
    .v-face::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      filter: url(#btn-glass);
      -webkit-filter: url(#btn-glass);
      overflow: hidden;
      isolation: isolate;
      z-index: -1;
    }

    .v-face > * { position: relative; z-index: 1; }

    .v-f0 { transform: rotateX(0deg)    translateZ(17px); cursor: pointer; width: 100%; font-family: inherit; flex-direction: row; gap: 5px; }
    .v-f1 { transform: rotateX(-120deg) translateZ(17px); padding: 0 16px; }
    .v-f2 { transform: rotateX(-240deg) translateZ(17px); }

    .v-f0-top { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .v-f0-sub { font-size: 12px; font-weight: 800; white-space: nowrap; color: #ffffff; }

    .v-f1 input {
      width: 100%; background: transparent; border: none; outline: none;
      color: #fff; font-size: 16px; font-family: inherit;
      text-align: center; letter-spacing: 0.04em;
    }
    .v-f1 input::placeholder { color: rgba(255,255,255,0.35); }
    .v-f2 { color: #a8f0c0; font-size: 14px; font-weight: 600; }

    /* ── Анимированный контур (из index.html) ── */
    @property --ca {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    .border-glow-wrap {
      position: absolute; inset: 0; border-radius: 4px;
      pointer-events: none; z-index: 5; overflow: hidden;
    }
    .border-glow-sm {
      position: absolute; inset: 0; border-radius: 4px;
      padding: 0.8px; pointer-events: none;
      background: conic-gradient(
        from var(--ca) at 50% 50%,
        hsla(300,20%,55%,0.35), hsla(275,20%,40%,0.30),
        hsla(240,20%,55%,0.35), hsla(180,20%,55%,0.30),
        hsla(0,0%,100%,0.65),  hsla(120,20%,50%,0.30),
        hsla(60,20%,55%,0.35), hsla(30,20%,55%,0.30),
        hsla(0,20%,55%,0.35),  hsla(300,20%,55%,0.35)
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: ca-spin 40s linear infinite;
    }
    @keyframes ca-spin { from{--ca:0deg} to{--ca:360deg} }

    /* Инset glow для всех блоков */
    .card-glow {
      background: #000 !important;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06),
        inset 0 0 20px 2px rgba(255,160,0,0.05) !important;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <a href="index.html" class="back-link">← назад в каталог</a>
      <button class="next-model-btn" id="btn-next-model">
        показати наступну модель
        <img src="https://www.svgrepo.com/show/466811/up-sign.svg" style="width:11px;height:11px;filter:invert(1);opacity:0.5;transform:rotate(90deg);margin-left:4px;vertical-align:middle" alt="">
      </button>
    </div>

    <div class="card-content">
      <main class="product-page">

        <div class="viewer-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-loader" id="viewer-loader">
            <div class="spinner"></div> Загрузка…
          </div>
        </div>

        <!-- Название + размеры -->
        <div class="product-name-row">
          <div class="product-name-big" id="p-name">—</div>
          <div class="product-sizes" id="p-sizes"></div>
        </div>

        <div class="material-section">
          <div class="material-slider-outer" id="slider-outer">
            <div class="material-slider-wrap" id="slider-wrap">
              <div class="material-slider" id="material-slider"></div>
            </div>
          </div>
        </div>

        <div class="procedural-toggle">
          <div class="procedural-toggle-row">
            <span>Процедурна генерація</span>
            <label class="toggle-switch">
              <input type="checkbox" id="proc-toggle">
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="procedural-hint">Якщо вам потрібно кілька моделей — процедурний генератор зробить кожну унікальною</div>
        </div>

      </main>
    </div>

    <!-- Кнопка заказа — CSS призма -->
    <div class="card-order">
      <div class="v-scene" id="order-scene">
        <div class="v-rotor" id="order-rotor">
          <button class="v-face v-f0" id="face-order">
            <span style="font-size:15px;font-weight:800;white-space:nowrap" id="btn-order-label">Замовити</span>
            <span class="v-f0-sub" id="btn-order-price"></span>
          </button>
          <div class="v-face v-f1" id="face-phone">
            <input type="tel" id="phone-input" placeholder="+380XXXXXXXXX" autocomplete="tel" inputmode="tel">
          </div>
          <div class="v-face v-f2" id="face-success">
            <span style="font-size:14px;font-weight:800;color:#ffffff;white-space:nowrap">Замовлення прийнято. Ми з вами звʼяжемось.</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
      "three/addons/loaders/RGBELoader.js": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/RGBELoader.js",
      "three/addons/loaders/DRACOLoader.js": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/DRACOLoader.js"
    }
  }
  </script>
  <!-- SVG фильтр для жидкого стекла -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0">
    <defs>
      <filter id="btn-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="1" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="1.5"/>
      </filter>
    </defs>
  </svg>

  <script src="catalog.js"></script>
  <script>
    // Анимированные контуры на блоки
    [
      ['.viewer-wrap', '-0s'],
      ['.back-link', '-8s'],
      ['.next-model-btn', '-16s'],
      ['.card-content', '-24s'],
      ['.card-order', '-32s'],
    ].forEach(([sel, delay]) => {
      document.querySelectorAll(sel).forEach(el => {
        el.style.position = 'relative';
        const wrap = document.createElement('div'); wrap.className = 'border-glow-wrap';
        const g = document.createElement('div'); g.className = 'border-glow-sm';
        g.style.animationDelay = delay;
        wrap.appendChild(g); el.appendChild(wrap);
      });
    });
  </script>
  <script type="module" src="viewer.js"></script>
  <script type="module" src="button-gl.js"></script>
</body>
</html>
