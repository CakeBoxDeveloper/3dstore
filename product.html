<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — товар</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #080808; }
    body { font-family: system-ui, sans-serif; color: #f0f0f0; }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ── Хедер — одна строка ── */
    .card-header {
      flex-shrink: 0;
      padding: 12px 16px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
    }
    .back-link {
      font-size: 14px;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
      justify-self: start;
    }
    .back-link:hover { color: #f0f0f0; }
    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Контент — фиксированный, не растягивается ── */
    .card-content {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .product-page {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
    }
    .product-page::-webkit-scrollbar { display: none; }

    /* Вьювер — уменьшен (4:3 вместо 1:1) */
    .viewer-wrap {
      background: transparent;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    #viewer-canvas { width: 100%; aspect-ratio: 4 / 3; display: block; }

    .viewer-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; font-size: 13px; color: #888;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #2e2e2e; border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .product-name-row { margin-bottom: 8px; flex-shrink: 0; }
    .product-name-big  { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
    .product-sizes     { font-size: 12px; color: #666; margin-top: 2px; }

    /* ── Слайдер материалов ── */
    .material-section { margin-bottom: 8px; flex-shrink: 0; }
    .material-slider-outer { position: relative; }
    .material-slider-wrap  { overflow-x: auto; scrollbar-width: none; }
    .material-slider-wrap::-webkit-scrollbar { display: none; }
    .material-slider { display: flex; gap: 7px; width: max-content; padding-bottom: 4px; }

    .material-slider-outer::before,
    .material-slider-outer::after {
      content: ''; position: absolute; top: 0; bottom: 4px;
      width: 24px; z-index: 2; pointer-events: none; transition: opacity 0.2s;
    }
    .material-slider-outer::before { left: 0;  background: linear-gradient(to right, #1a1a1a, transparent); }
    .material-slider-outer::after  { right: 0; background: linear-gradient(to left,  #1a1a1a, transparent); }
    .material-slider-outer.at-start::before { opacity: 0; }
    .material-slider-outer.at-end::after    { opacity: 0; }

    .mat-chip {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 4px 5px;
      min-width: 48px;
      background: transparent; border: 1.5px solid #2e2e2e; border-radius: 4px;
      cursor: pointer; font-family: inherit;
      transition: border-color 0.15s; flex-shrink: 0;
    }
    .mat-chip:hover  { border-color: #666; }
    .mat-chip.active { border-color: #f0f0f0; }
    .mat-chip-color {
      width: 40px; height: 26px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .mat-chip-type {
      font-size: 8px; font-weight: 800; letter-spacing: 0.05em;
      /* Цвет текста = фон родителя — эффект "дырки" */
      mix-blend-mode: luminosity;
      color: #000;
      opacity: 0.55;
    }
    /* подпись цвета убрана */

    /* ── Тумблер ── */
    .procedural-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 0;
      font-size: 12px;
      color: #666;
      flex-shrink: 0;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2e2e2e;
      border-radius: 11px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #555;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #1a5276; }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: #fff;
    }

    /* ── WebGL-кнопка заказа ── */
    .card-order {
      flex-shrink: 0;
      height: 52px;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="card-header">
      <a href="index.html" class="back-link">← Назад в каталог</a>
    </div>

    <div class="card-content">
      <main class="product-page">

        <div class="viewer-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-loader" id="viewer-loader">
            <div class="spinner"></div> Загрузка…
          </div>
        </div>

        <!-- Название + размеры -->
        <div class="product-name-row">
          <div class="product-name-big" id="p-name">—</div>
          <div class="product-sizes" id="p-sizes"></div>
        </div>

        <div class="material-section">
          <div class="material-slider-outer" id="slider-outer">
            <div class="material-slider-wrap" id="slider-wrap">
              <div class="material-slider" id="material-slider"></div>
            </div>
          </div>
        </div>

        <div class="procedural-toggle">
          <span>Процедурна генерація</span>
          <label class="toggle-switch">
            <input type="checkbox" id="proc-toggle">
            <span class="toggle-track"></span>
          </label>
        </div>

      </main>
    </div>

    <!-- WebGL кнопка заказа -->
    <div class="card-order" id="order-btn-container"></div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
      "three/addons/loaders/RGBELoader.js": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/RGBELoader.js"
    }
  }
  </script>
  <script src="catalog.js"></script>
  <script type="module" src="viewer.js"></script>
  <script type="module" src="button-gl.js"></script>
</body>
</html>
