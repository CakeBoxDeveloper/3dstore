<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Store — товар</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site-frame">

  <header class="site-header">
    <div class="site-logo">3D Store</div>
  </header>

  <main class="product-page">
    <a href="index.html" class="back-link">← Назад</a>

    <!-- 3D Viewer -->
    <div class="viewer-wrap">
      <canvas id="viewer-canvas"></canvas>
      <div class="viewer-loader" id="viewer-loader">
        <div class="spinner"></div> Загрузка…
      </div>
      <div class="viewer-hint">Drag to rotate · Scroll to zoom</div>
    </div>

    <!-- Название + цена в одну строку -->
    <div class="product-info-block">
      <div class="product-name-price-row">
        <div class="product-name-big" id="p-name">—</div>
        <div class="product-price-big" id="p-price">—</div>
      </div>
      <div class="product-category-path" id="p-path">—</div>
      <div class="product-description" id="p-desc">—</div>
    </div>

    <!-- Слайдер материалов без заголовка -->
    <div class="material-section">
      <div class="material-slider-outer" id="slider-outer">
        <div class="material-slider-wrap" id="slider-wrap">
          <div class="material-slider" id="material-slider"></div>
        </div>
      </div>
    </div>

    <!-- 3D flip кнопка -->
    <div class="order-block">
      <div class="flip-btn" id="flip-btn">

        <!-- Грань 0: Заказать -->
        <button class="flip-face face-order" id="face-order">Заказать</button>

        <!-- Грань 1: Ввод телефона -->
        <div class="flip-face face-phone" id="face-phone">
          <input type="tel" id="phone-input" placeholder="+380 XX XXX XX XX" autocomplete="tel" inputmode="tel">
          <span class="phone-hint" id="phone-hint-btn">→</span>
        </div>

        <!-- Грань 2: Подтвердить / Назад -->
        <div class="flip-face face-confirm" id="face-confirm">
          <button class="btn-back" id="btn-back">← Назад</button>
          <button class="btn-go" id="btn-go">Подтвердить</button>
        </div>

      </div>
      <!-- success toast под кнопкой -->
      <div class="order-success-toast" id="success-toast">
        ✅ Заказ отправлен! Свяжемся с вами.
      </div>
    </div>

  </main>

</div>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
    }
  }
  </script>

  <script src="catalog.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
