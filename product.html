<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Store — товар</title>
  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif; color: #f0f0f0;
      background-color: #000;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ── Хедер — одна строка ── */
    @font-face {
      font-family: 'Ageta';
      src: url('https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/main/liquid.italic.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    .card-header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 3fr 7fr;
      gap: 8px;
      height: 44px;
      background: transparent;
    }

    .header-back, .header-next, .back-link, .next-model-btn {
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      background: rgba(10,10,15,0.55);
      border-radius: 4px;
    }
    .back-link {
      display: flex; align-items: center; justify-content: center;
      padding: 0 12px; font-size: 13px; font-weight: 700; color: #f0f0f0;
      text-decoration: none; transition: color 0.15s;
      background: #000; border-radius: 4px; white-space: nowrap;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 16px 2px rgba(80,100,255,0.10),
        inset 0 0 16px 2px rgba(255,60,120,0.06);
    }
    .back-link:hover { color: #fff; }

    /* ── Флип-призма навигации моделей ── */
    .nav-flip-wrap {
      position: relative;
      height: 44px;
      overflow: visible;
      border-radius: 4px;
    }
    .nav-flip-scene {
      width: 100%; height: 44px;
      perspective: 400px;
      perspective-origin: 50% 50%;
    }
    .nav-flip-rotor {
      width: 100%; height: 44px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-22px) rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-flip-face {
      position: absolute; inset: 0;
      border-radius: 4px;
      display: flex; align-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #000;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 16px 2px rgba(80,100,255,0.10),
        inset 0 0 16px 2px rgba(255,160,0,0.06);
      overflow: hidden;
    }
    .nav-flip-face-a { transform: rotateX(0deg)   translateZ(22px); }
    .nav-flip-face-b { transform: rotateX(-180deg) translateZ(22px); }

    .nav-flip-arrow {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: rgba(255,255,255,0.4);
      cursor: pointer; flex-shrink: 0;
      background: none; border: none; font-family: inherit;
      transition: color 0.15s; z-index: 1;
    }
    .nav-flip-arrow:hover { color: #fff; }
    .nav-flip-label {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 4px;
      margin: 0 2px;
      text-shadow: -0.5px 0 0.5px rgba(255,80,80,0.5), 0.5px 0 0.5px rgba(80,160,255,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      /* Умный fadeout по краям */
      -webkit-mask-image: linear-gradient(
        90deg,
        transparent 0px,
        black 10px,
        black calc(100% - 10px),
        transparent 100%
      );
      mask-image: linear-gradient(
        90deg,
        transparent 0px,
        black 10px,
        black calc(100% - 10px),
        transparent 100%
      );
    }

    /* Shimmer при флипе */
    .nav-flip-rotor.flipping .nav-flip-face::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 5%,
        rgba(255,255,255,0.06) 40%,
        rgba(220,235,255,0.18) 50%,
        rgba(255,255,255,0.06) 60%,
        transparent 95%
      );
      animation: nav-shimmer 0.5s cubic-bezier(0.4,0,0.2,1) both;
      pointer-events: none; border-radius: 4px;
    }
    @keyframes nav-shimmer {
      from { transform: translateY(-120%); }
      to   { transform: translateY(120%); }
    }
    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Контент — фиксированный, не растягивается ── */
    .card-content {
      background: #000;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 24px 4px rgba(80,100,255,0.10),
        inset 0 0 24px 4px rgba(255,60,120,0.06),
        inset 0 0 24px 4px rgba(255,160,0,0.05);
      border-radius: 4px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Вьювер — -10% по ширине и высоте */
    .viewer-wrap {
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin: 0 5% 10px;
      flex-shrink: 0;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06);
    }
    #viewer-canvas { width: 100%; aspect-ratio: 16 / 10; display: block; }

    .viewer-loader {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000;
      gap: 0;
    }

    .product-name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 5% 8px;
      flex-shrink: 0;
    }

    /* ── Слайдер материалов ── */
    .material-section { margin: 0 5% 8px; flex-shrink: 0; }
    .product-name-big {
      font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3;
      text-shadow: -0.5px 0 0.5px rgba(255,80,80,0.5), 0.5px 0 0.5px rgba(80,160,255,0.5);
    }
    .product-sizes    { font-size: 16px; font-weight: 700; color: #f0f0f0; white-space: nowrap; flex-shrink: 0; }

    .product-page {
      height: 100%;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none;
      padding: 10px 14px 14px;
      display: flex; flex-direction: column;
      background: #000;
    }
    .product-page::-webkit-scrollbar { display: none; }

    .material-slider-outer { position: relative; }
    .material-slider-wrap  { overflow-x: auto; scrollbar-width: none; }
    .material-slider-wrap::-webkit-scrollbar { display: none; }
    .material-slider { display: flex; gap: 7px; width: max-content; padding-bottom: 4px; }

    .material-slider-outer::before,
    .material-slider-outer::after {
      content: ''; position: absolute; top: 0; bottom: 4px;
      width: 24px; z-index: 2; pointer-events: none; transition: opacity 0.2s;
    }
    .material-slider-outer::before { left: 0;  background: linear-gradient(to right, #000, transparent); z-index: 1; }
    .material-slider-outer::after  { right: 0; background: linear-gradient(to left,  #000, transparent); z-index: 1; }
    .material-slider-outer.at-start::before { opacity: 0; }
    .material-slider-outer.at-end::after    { opacity: 0; }

    .mat-chip {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 4px 5px;
      min-width: 48px;
      background: transparent; border: 1.5px solid #2e2e2e; border-radius: 4px;
      cursor: pointer; font-family: inherit;
      transition: border-color 0.15s; flex-shrink: 0;
    }
    .mat-chip:hover  { border-color: #666; }
    .mat-chip.active { border-color: #f0f0f0; }
    .mat-chip-color {
      width: 40px; height: 26px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .mat-chip-type {
      font-size: 8px; font-weight: 800; letter-spacing: 0.05em;
      /* Цвет текста = фон родителя — эффект "дырки" */
      mix-blend-mode: luminosity;
      color: #000;
      opacity: 0.55;
    }
    /* подпись цвета убрана */

    /* ── Тумблер процедурной генерации ── */
    .procedural-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 4px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      margin: 4px 5%;
      flex-direction: column;
      gap: 6px;
      background: #000;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 14px 2px rgba(80,100,255,0.08);
      position: relative;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }
    /* Анимация зажигания глоу: яркая вспышка на 100% и плавный спад до 50% за 1 секунду */
    @keyframes toggle-glow-ignition {
      0% {
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.35),
          inset 0 0 32px 6px rgba(80,100,255,0.36),
          inset 0 0 32px 6px rgba(255,60,120,0.28),
          inset 0 0 32px 6px rgba(255,160,0,0.22),
          0 0 24px 4px rgba(80,120,255,0.45);
      }
      100% {
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.18),
          inset 0 0 16px 3px rgba(80,100,255,0.15),
          inset 0 0 16px 3px rgba(255,60,120,0.11),
          inset 0 0 16px 3px rgba(255,160,0,0.09),
          0 0 10px 2px rgba(80,120,255,0.18);
      }
    }

    /* Активное состояние тумблера */
    .procedural-toggle:has(input:checked),
    .procedural-toggle.active {
      border-color: rgba(255, 255, 255, 0.35);
      animation: toggle-glow-ignition 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    /* Рамка с шиммером сохраняет 100% интенсивности без затухания */
    .procedural-toggle:has(input:checked) .border-glow-sm,
    .procedural-toggle.active .border-glow-sm {
      opacity: 1 !important;
      filter: blur(0.5px) drop-shadow(0 0 6px rgba(255, 255, 255, 0.95)) !important;
    }
    .procedural-toggle:has(input:checked) .border-glow-aura,
    .procedural-toggle.active .border-glow-aura {
      opacity: 0.85 !important;
      filter: blur(12px) drop-shadow(0 0 10px rgba(80, 140, 255, 0.8)) !important;
    }
    .procedural-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .procedural-hint {
      font-size: 11px;
      font-weight: 400;
      color: #a0a8b0;
      padding-bottom: 4px;
      width: 100%;
      line-height: 1.4;
      transition: color 0.2s ease;
    }
    .procedural-toggle:has(input:checked) .procedural-hint,
    .procedural-toggle.active .procedural-hint {
      color: #d8e4f0;
    }
    .toggle-switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #222228;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
      cursor: pointer;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 3px;
      background: #666;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), background 0.25s, box-shadow 0.25s;
    }
    .toggle-switch input:checked + .toggle-track {
      background: rgba(80, 120, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 10px rgba(80, 140, 255, 0.5);
    }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
    }

    /* ── Бегущая строка (Marquee) влево-вправо ── */
    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    .marquee-active {
      animation: marquee-pingpong var(--marquee-duration, 5s) ease-in-out infinite;
    }
    @keyframes marquee-pingpong {
      0%, 18% { transform: translateX(0); }
      50%, 68% { transform: translateX(var(--marquee-dist, -24px)); }
      100% { transform: translateX(0); }
    }

    /* ── Призма-кнопка — CSS с двухслойным фоном ── */
    .card-order {
      overflow: visible;
      background: transparent;
      border: none;
      flex-shrink: 0;
      height: 52px;
    }

    .v-scene {
      width: 100%;
      height: 52px;
      perspective: 400px;
      perspective-origin: 50% 50%;
    }

    .v-rotor {
      width: 100%;
      height: 52px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-17px) rotateX(0deg);
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Грань: жидкое стекло через SVG filter */
    .v-face {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      gap: 6px;
      background: transparent;
      outline: none;
      border: none;
    }

    /* Слой 1: glow + контур + преломление */
    .v-face::before {
      content: '';
      position: absolute; inset: 0; border-radius: 4px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.10),
        inset 0 0 20px 3px rgba(80,100,255,0.12),
        inset 0 0 20px 3px rgba(255,60,120,0.07);
      background: rgba(0, 0, 0, 0.60);
      -webkit-backdrop-filter: url(#catalog-glass);
      backdrop-filter: url(#catalog-glass);
      z-index: 0;
    }

    /* Слой 2: жидкое стекло через SVG filter */
    .v-face::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      filter: url(#btn-glass);
      -webkit-filter: url(#btn-glass);
      overflow: hidden;
      isolation: isolate;
      z-index: -1;
    }

    .v-face > * { position: relative; z-index: 1; }

    .v-f0 { transform: rotateX(0deg)    translateZ(17px); cursor: pointer; width: 100%; font-family: inherit; flex-direction: row; gap: 5px; }
    .v-f1 { transform: rotateX(-120deg) translateZ(17px); padding: 0 16px; }
    .v-f2 { transform: rotateX(-240deg) translateZ(17px); }

    .v-f0-top { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .v-f0-sub { font-size: 12px; font-weight: 800; white-space: nowrap; color: #ffffff; }

    .v-f1 input {
      width: 100%; background: transparent; border: none; outline: none;
      color: #fff; font-size: 16px; font-family: inherit;
      text-align: center; letter-spacing: 0.04em;
    }
    .v-f1 input::placeholder { color: rgba(255,255,255,0.35); }
    .v-f2 { color: #a8f0c0; font-size: 14px; font-weight: 600; }

    /* ── Анимированный контур (из index.html) ── */
    @property --ca {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    .border-glow-wrap {
      position: absolute; inset: 0; border-radius: 4px;
      pointer-events: none; z-index: 10; overflow: hidden;
    }
    .border-glow-sm {
      position: absolute; inset: 0; border-radius: 4px;
      padding: 0.8px; pointer-events: none;
      background: conic-gradient(
        from var(--ca) at 50% 50%,
        hsla(300,20%,55%,0.35), hsla(275,20%,40%,0.30),
        hsla(240,20%,55%,0.35), hsla(180,20%,55%,0.30),
        hsla(0,0%,100%,0.65),  hsla(120,20%,50%,0.30),
        hsla(60,20%,55%,0.35), hsla(30,20%,55%,0.30),
        hsla(0,20%,55%,0.35),  hsla(300,20%,55%,0.35)
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: ca-spin 40s linear infinite;
    }
    @keyframes ca-spin { from{--ca:0deg} to{--ca:360deg} }

    /* Инset glow для всех блоков */
    .card-glow {
      background: #000 !important;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 0 20px 2px rgba(80,100,255,0.10),
        inset 0 0 20px 2px rgba(255,60,120,0.06),
        inset 0 0 20px 2px rgba(255,160,0,0.05) !important;
    }
    /* ── Стили пульсирующего лоадера PRISM ── */
    .prism-loader-box {
      position: relative;
      width: 220px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prism-loader-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
      animation: prism-pulse-glow 2.4s ease-in-out infinite alternate;
    }
    @keyframes prism-pulse-glow {
      0% {
        opacity: 0.55;
        filter: brightness(0) invert(1) drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        transform: scale(0.97);
      }
      50% {
        opacity: 1;
        filter: brightness(0) invert(1)
                drop-shadow(0 0 14px rgba(255, 255, 255, 0.95))
                drop-shadow(0 0 28px rgba(100, 140, 255, 0.6))
                drop-shadow(0 0 45px rgba(255, 80, 140, 0.35));
        transform: scale(1.02);
      }
      100% {
        opacity: 0.55;
        filter: brightness(0) invert(1) drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        transform: scale(0.97);
      }
    }
  </style>
</head>
<body>
  <!-- ── Лоадер страницы ── -->
  <div id="page-loader" style="
    position:fixed;inset:0;z-index:9999;
    background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity 0.5s ease;
  ">
    <div class="prism-loader-box">
      <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg"
           class="prism-loader-logo" alt="PRISM">
    </div>
  </div>
  <script>
    (function() {
      const loader = document.getElementById('page-loader');
      const MIN_MS = 1400;
      const start  = Date.now();

      window.addEventListener('load', () => {
        const delay = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(() => {
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 520);
          }
        }, delay);
      });
    })();
  </script>
  <div class="page">

    <div class="card-header">
      <a href="index.html" class="back-link">назад в каталог</a>
      <div class="nav-flip-wrap" id="nav-flip-wrap">
        <div class="nav-flip-scene">
          <div class="nav-flip-rotor" id="nav-flip-rotor">
            <div class="nav-flip-face nav-flip-face-a" id="nav-face-a">
              <button class="nav-flip-arrow" id="nav-prev">↑</button>
              <span class="nav-flip-label" id="nav-label-a">—</span>
              <button class="nav-flip-arrow" id="nav-next">↓</button>
            </div>
            <div class="nav-flip-face nav-flip-face-b" id="nav-face-b">
              <button class="nav-flip-arrow" id="nav-prev-b">↑</button>
              <span class="nav-flip-label" id="nav-label-b"></span>
              <button class="nav-flip-arrow" id="nav-next-b">↓</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-content">
      <main class="product-page">

      <div class="viewer-wrap">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-loader" id="viewer-loader">
            <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/3dstore/b83638b4b452cb7ba7253bef65b6811cb569c968/PrismLogo2.svg"
                 alt="PRISM" style="height:28px;filter:brightness(0) invert(1);opacity:0.7;margin-bottom:12px;">
            <div style="width:120px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
              <div id="viewer-progress" style="height:100%;width:0%;background:rgba(255,255,255,0.5);transition:width 0.2s;border-radius:2px;"></div>
            </div>
          </div>
        </div>

        <!-- Название + размеры -->
        <div class="product-name-row">
          <div class="product-name-big" id="p-name">—</div>
          <div class="product-sizes" id="p-sizes"></div>
        </div>

        <div class="material-section">
          <div class="material-slider-outer" id="slider-outer">
            <div class="material-slider-wrap" id="slider-wrap">
              <div class="material-slider" id="material-slider"></div>
            </div>
          </div>
        </div>

        <div class="procedural-toggle">
          <div class="procedural-toggle-row">
            <span>Процедурна генерація</span>
            <label class="toggle-switch">
              <input type="checkbox" id="proc-toggle">
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="procedural-hint">Якщо вам потрібно кілька моделей — процедурний генератор PRISM зробить кожну унікальною</div>
        </div>

      </main>
    </div>

    <!-- Кнопка заказа — CSS призма -->
    <div class="card-order">
      <div class="v-scene" id="order-scene">
        <div class="v-rotor" id="order-rotor">
          <button class="v-face v-f0" id="face-order">
            <span style="font-size:15px;font-weight:800;white-space:nowrap" id="btn-order-label">Замовити</span>
            <span class="v-f0-sub" id="btn-order-price"></span>
          </button>
          <div class="v-face v-f1" id="face-phone">
            <input type="tel" id="phone-input" placeholder="+380XXXXXXXXX" autocomplete="tel" inputmode="tel">
          </div>
          <div class="v-face v-f2" id="face-success">
            <span style="font-size:14px;font-weight:800;color:#ffffff;white-space:nowrap">Замовлення прийнято. Ми з вами звʼяжемось.</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
      "three/addons/loaders/RGBELoader.js": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/RGBELoader.js",
      "three/addons/loaders/DRACOLoader.js": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/DRACOLoader.js"
    }
  }
  </script>
  <!-- SVG фильтр для жидкого стекла -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0">
    <defs>
      <filter id="btn-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="1" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="1.5"/>
      </filter>
    </defs>
  </svg>

  <script src="catalog.js"></script>
  <script>
    // Анимированные контуры на статические блоки
    [
      ['.viewer-wrap', '-0s'],
      ['.back-link', '-8s'],
      ['.procedural-toggle', '-12s'],
      ['.card-content', '-24s'],
    ].forEach(([sel, delay]) => {
      document.querySelectorAll(sel).forEach(el => {
        el.style.position = 'relative';
        const wrap = document.createElement('div'); wrap.className = 'border-glow-wrap';
        const g = document.createElement('div'); g.className = 'border-glow-sm';
        g.style.animationDelay = delay;
        wrap.appendChild(g); el.appendChild(wrap);
      });
    });
    // Контур на каждую грань флип-ротора навигации — вращается вместе с гранью
    document.querySelectorAll('.nav-flip-face').forEach((face, i) => {
      const wrap = document.createElement('div'); wrap.className = 'border-glow-wrap';
      const g = document.createElement('div'); g.className = 'border-glow-sm';
      g.style.animationDelay = `${-16 - i * 8}s`;
      wrap.appendChild(g); face.appendChild(wrap);
    });
    // Контур на каждую грань кнопки заказа — флипается вместе с ней
    document.querySelectorAll('.v-face').forEach((face, i) => {
      const wrap = document.createElement('div'); wrap.className = 'border-glow-wrap';
      const g = document.createElement('div'); g.className = 'border-glow-sm';
      g.style.animationDelay = `${-32 - i * 8}s`;
      wrap.appendChild(g); face.appendChild(wrap);
    });
  </script>
  <script type="module" src="viewer.js"></script>
  <script type="module" src="button-gl.js"></script>
</body>
</html>
