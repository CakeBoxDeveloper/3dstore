<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prism Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; background: #080808; }

    body {
      font-family: system-ui, sans-serif;
      color: #f0f0f0;
    }

    .page {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }

    /* ── Карточка-обёртка ── */
    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 14px;
      /* ВАЖНО: overflow: visible — не убивает preserve-3d */
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-header { flex-shrink: 0; overflow: hidden; padding: 12px 16px; }
    .card-catalog { flex: 1; min-height: 0; }
    .card-order   { flex-shrink: 0; height: 80px; }

    /* ══════════════════════════════════════
       ГОРИЗОНТАЛЬНАЯ ПРИЗМА (ось Y) — каталог
    ══════════════════════════════════════ */

    /*
      Структура:
        .h-scene   — perspective, ничего лишнего
          .h-rotor — transform-style:preserve-3d, вращается
            .h-f0  — грань 0: rotateY(0deg)   translateZ(r)
            .h-f1  — грань 1: rotateY(120deg)  translateZ(r)
            .h-f2  — грань 2: rotateY(240deg)  translateZ(r)

      r = W / (2 * tan(60°)) = W / (2√3)
      Для W=440: r ≈ 127px
      Задаём r = 120px как константу для теста.
    */

    .h-scene {
      width: 100%;
      height: 100%;
      perspective: 600px;
      perspective-origin: 50% 50%;
      /* НЕТ: overflow, background, border, filter, will-change */
    }

    .h-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin-y 4s linear infinite;
    }

    @keyframes spin-y {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    .h-face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .h-f0 { transform: rotateY(0deg)   translateZ(120px); background: rgba(231,76,60,0.85);  }
    .h-f1 { transform: rotateY(120deg) translateZ(120px); background: rgba(41,128,185,0.85); }
    .h-f2 { transform: rotateY(240deg) translateZ(120px); background: rgba(39,174,96,0.85);  }

    /* ══════════════════════════════════════
       ВЕРТИКАЛЬНАЯ ПРИЗМА (ось X) — кнопка
    ══════════════════════════════════════ */

    /*
      Для кнопки высотой H=80px:
      r = H / (2 * tan(60°)) = 80 / (2√3) ≈ 23px
    */

    .v-scene {
      width: 100%;
      height: 100%;
      perspective: 300px;
      perspective-origin: 50% 50%;
    }

    .v-rotor {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin-x 3s linear infinite;
    }

    @keyframes spin-x {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(360deg); }
    }

    .v-face {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .v-f0 { transform: rotateX(0deg)   translateZ(23px); background: rgba(231,76,60,0.9);  color: #fff; }
    .v-f1 { transform: rotateX(-120deg) translateZ(23px); background: rgba(41,128,185,0.9); color: #fff; }
    .v-f2 { transform: rotateX(-240deg) translateZ(23px); background: rgba(39,174,96,0.9);  color: #fff; }
  </style>
</head>
<body>
  <div class="page">

    <!-- Хедер -->
    <div class="card card-header">
      <span style="font-size:17px;font-weight:700">3D Store — Prism Test</span>
    </div>

    <!-- Горизонтальная призма (ось Y) -->
    <div class="card card-catalog">
      <div class="h-scene">
        <div class="h-rotor">
          <div class="h-face h-f0">Пластик</div>
          <div class="h-face h-f1">Воск</div>
          <div class="h-face h-f2">Эпоксидка</div>
        </div>
      </div>
    </div>

    <!-- Вертикальная призма (ось X) -->
    <div class="card card-order">
      <div class="v-scene">
        <div class="v-rotor">
          <div class="v-face v-f0">Заказати</div>
          <div class="v-face v-f1">+380...</div>
          <div class="v-face v-f2">✅ Прийнято!</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
